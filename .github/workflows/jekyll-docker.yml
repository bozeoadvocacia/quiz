// -- Do material do usuário --
{category:"Direito Trabalhista",question:"O corretor de imóveis que trabalha com autonomia, sem subordinação, habitualidade ou exclusividade, possui vínculo empregatício com a imobiliária?",options:["Sim, sempre","Não, pois falta o requisito da subordinação jurídica","Sim, se receber comissão","Depende exclusivamente do valor da comissão"],correct:1,explanation:"Sem os requisitos da relação de emprego (subordinação, pessoalidade, habitualidade e onerosidade), não há vínculo empregatício (art. 3º CLT)."},
{category:"Direito Trabalhista",question:"Qual é o principal risco trabalhista para imobiliárias que contratam corretores como autônomos?",options:["Pagamento de IPTU em atraso","Reconhecimento de vínculo empregatício na Justiça do Trabalho","Multa do CRECI","Perda do alvará de funcionamento"],correct:1,explanation:"O principal risco é a Justiça do Trabalho reconhecer o vínculo empregatício se presentes os requisitos da relação de emprego."},
{category:"Direito Trabalhista",question:"Qual situação pode levar ao reconhecimento de vínculo empregatício entre uma imobiliária e um corretor?",options:["O corretor receber apenas comissões pelas vendas","O corretor possuir inscrição regular no CRECI","Estarem presentes subordinação, pessoalidade, habitualidade e onerosidade","O corretor utilizar veículo próprio para visitar imóveis"],correct:2,explanation:"O vínculo é reconhecido quando presentes todos os requisitos legais: subordinação, pessoalidade, habitualidade e onerosidade (art. 3º CLT)."},
{category:"Direito Trabalhista",question:"Sobre a jornada de trabalho do corretor de imóveis, é correto afirmar que:",options:["Todo corretor possui jornada fixa de 8 horas diárias","O corretor autônomo faz jus ao pagamento de horas extras","O simples cumprimento de metas caracteriza vínculo empregatício","O corretor autônomo organiza sua própria rotina; o empregado segue regras trabalhistas"],correct:3,explanation:"O corretor autônomo tem liberdade de horário. Já o corretor empregado está sujeito às regras da CLT sobre jornada de trabalho."},

// -- Novas perguntas --
{category:"Direito Trabalhista",question:"Quais são os 4 requisitos cumulativos para caracterizar a relação de emprego?",options:["Contrato, CTPS, salário e férias","Subordinação, pessoalidade, habitualidade e onerosidade","Registro no CRECI, comissão, horário e exclusividade","Contrato escrito, local fixo, horário e benefícios"],correct:1,explanation:"Os requisitos são: subordinação (ordens), pessoalidade (insubstituível), habitualidade (não eventual) e onerosidade (remuneração) — art. 3º CLT."},
{category:"Direito Trabalhista",question:"O que é a subordinação jurídica no contexto trabalhista?",options:["O trabalhador depender financeiramente do empregador","O trabalhador estar sujeito ao poder de direção e comando do empregador","O trabalhador trabalhar exclusivamente para uma empresa","O trabalhador usar uniforme da empresa"],correct:1,explanation:"Subordinação jurídica é a sujeição do empregado ao poder diretivo do empregador, que organiza, controla e disciplina a prestação de serviço."},
{category:"Direito Trabalhista",question:"A Reforma Trabalhista (Lei 13.467/2017) trouxe qual novidade sobre o trabalho autônomo?",options:["Proibiu a contratação de autônomos","Permitiu a contratação com exclusividade e continuidade sem configurar vínculo, desde que cumpridas formalidades","Obrigou registro em CTPS de todos os autônomos","Reduziu a comissão máxima para 3%"],correct:1,explanation:"O art. 442-B da CLT (incluído pela Reforma) prevê que a contratação de autônomo, mesmo com exclusividade e continuidade, não gera vínculo, observadas as condições legais."},
{category:"Direito Trabalhista",question:"Qual é o prazo prescricional para o trabalhador ajuizar reclamação trabalhista após a extinção do contrato?",options:["1 ano","2 anos","5 anos","10 anos"],correct:1,explanation:"O prazo prescricional é de 2 anos após a extinção do contrato, podendo reclamar os últimos 5 anos de direitos (art. 7º, XXIX, CF)."},
{category:"Direito Trabalhista",question:"O que é o aviso prévio proporcional ao tempo de serviço?",options:["Aviso de 30 dias fixos para todos","30 dias + 3 dias por ano trabalhado, até 90 dias no total","15 dias por ano trabalhado","60 dias fixos após 5 anos"],correct:1,explanation:"O aviso prévio é de 30 dias, acrescido de 3 dias por ano de serviço, limitado a 90 dias no total (Lei 12.506/2011)."},
{category:"Direito Trabalhista",question:"O corretor de imóveis empregado tem direito a comissão sobre vendas realizadas durante o aviso prévio?",options:["Não, o aviso prévio exclui comissões","Sim, durante o aviso prévio todos os direitos são mantidos","Apenas se houver acordo expresso","Somente se o aviso for indenizado"],correct:1,explanation:"Durante o aviso prévio, o contrato de trabalho permanece em vigor, mantendo todos os direitos e obrigações, inclusive comissões."},
{category:"Direito Trabalhista",question:"O que é a justa causa para demissão do empregado no mercado imobiliário?",options:["Qualquer insatisfação do empregador","Falta grave prevista no art. 482 da CLT, como improbidade ou desídia","Vendas abaixo da meta por 2 meses","Recusa em trabalhar aos domingos"],correct:1,explanation:"A justa causa exige falta grave tipificada no art. 482 da CLT, como ato de improbidade, incontinência, desídia, entre outras."},
{category:"Direito Trabalhista",question:"O que é o contrato de trabalho intermitente, aplicável ao mercado imobiliário?",options:["Contrato sem prazo definido","Contrato com alternância de períodos de prestação de serviço e inatividade","Contrato de experiência de 90 dias","Contrato apenas para finais de semana"],correct:1,explanation:"O contrato intermitente (art. 443, §3º, CLT) prevê alternância entre períodos de trabalho e inatividade, com convocação prévia."},
{category:"Direito Trabalhista",question:"O vale-transporte é obrigatório para o corretor de imóveis empregado?",options:["Não, nunca","Sim, quando solicitado pelo empregado para deslocamento residência-trabalho","Apenas para quem mora a mais de 10 km","Somente se o salário for inferior a 3 salários mínimos"],correct:1,explanation:"O vale-transporte é devido ao empregado que o solicitar para deslocamento casa-trabalho-casa (Lei 7.418/85)."},
{category:"Direito Trabalhista",question:"O FGTS é depositado para o corretor de imóveis contratado como autônomo?",options:["Sim, o FGTS é obrigatório para todos","Não, o FGTS é direito exclusivo de empregados com vínculo","Sim, mas com alíquota reduzida de 4%","Depende do faturamento da imobiliária"],correct:1,explanation:"O FGTS (8% sobre a remuneração) é obrigação do empregador apenas para empregados com vínculo formal (Lei 8.036/90)."},
{category:"Direito Trabalhista",question:"O que é a responsabilidade solidária trabalhista entre empresas do mesmo grupo econômico?",options:["Cada empresa responde apenas por seus empregados","Todas as empresas do grupo podem ser responsabilizadas pelas dívidas trabalhistas de qualquer uma delas","Apenas a empresa matriz responde","A responsabilidade é limitada ao capital social"],correct:1,explanation:"Empresas do mesmo grupo econômico são solidariamente responsáveis pelas obrigações trabalhistas (art. 2º, §2º, CLT)."},
{category:"Direito Trabalhista",question:"O corretor de imóveis empregado pode ter seu salário composto exclusivamente por comissões?",options:["Não, deve receber salário fixo obrigatoriamente","Sim, é possível o comissionista puro, garantido o salário mínimo","Somente se houver acordo coletivo","Apenas nos primeiros 6 meses de contrato"],correct:1,explanation:"É válido o comissionista puro (só comissões), mas deve ser garantido ao menos o salário mínimo mensal (art. 7º, VII, CF e Súmula 340 TST)."},
{category:"Direito Trabalhista",question:"O que é o contrato de experiência e qual seu prazo máximo?",options:["Contrato temporário de até 120 dias","Contrato de avaliação de até 90 dias, prorrogável uma vez","Contrato de 6 meses para todos os cargos","Contrato verbal de até 30 dias"],correct:1,explanation:"O contrato de experiência pode durar até 90 dias, admitida uma única prorrogação dentro desse limite (art. 445, parágrafo único, CLT)."},
{category:"Direito Trabalhista",question:"A imobiliária pode descontar do corretor empregado valores de vendas que foram distratadas pelo cliente?",options:["Sim, sempre","Não, salvo se comprovada culpa do corretor e houver previsão contratual","Sim, até 50% do valor da comissão","Apenas se o cliente estiver inadimplente há mais de 90 dias"],correct:1,explanation:"Descontos salariais só são permitidos com previsão legal ou contratual e quando houver culpa do empregado (art. 462 CLT)."},
{category:"Direito Trabalhista",question:"O que é o assédio moral no ambiente imobiliário e qual sua consequência jurídica?",options:["Apenas ofensas verbais, sem consequência","Conduta abusiva e repetitiva que humilha o trabalhador, podendo gerar rescisão indireta e indenização","Divergência de opiniões entre colegas","Cobrança normal de metas"],correct:1,explanation:"Assédio moral é conduta abusiva, repetitiva, que degrada o ambiente de trabalho, podendo gerar rescisão indireta (art. 483 CLT) e dano moral."},
{category:"Direito Trabalhista",question:"O que é a rescisão indireta do contrato de trabalho?",options:["Demissão sem justa causa","Pedido de demissão do empregado","Quando o empregado 'demite' o empregador por falta grave deste","Acordo entre as partes para encerrar o contrato"],correct:2,explanation:"A rescisão indireta ocorre quando o empregador comete falta grave (art. 483 CLT), garantindo ao empregado os mesmos direitos da demissão sem justa causa."},
{category:"Direito Trabalhista",question:"O que é o acordo para rescisão do contrato de trabalho previsto na Reforma Trabalhista?",options:["Acordo verbal sem formalização","Rescisão por acordo com aviso prévio e multa do FGTS pela metade e saque de 80% do FGTS","Demissão em massa autorizada pelo sindicato","Transferência para outra filial"],correct:1,explanation:"O acordo de rescisão (art. 484-A CLT) prevê metade do aviso prévio indenizado e da multa do FGTS (20%), com saque de 80% do saldo."},
{category:"Direito Trabalhista",question:"O recepcionista de uma imobiliária que trabalha 6 horas por dia tem direito a intervalo intrajornada de quanto tempo?",options:["Não tem direito a intervalo","15 minutos","30 minutos","1 hora"],correct:1,explanation:"Para jornadas entre 4 e 6 horas, o intervalo intrajornada é de 15 minutos (art. 71, §1º, CLT)."},
{category:"Direito Trabalhista",question:"A imobiliária pode exigir exclusividade do corretor autônomo?",options:["Não, exclusividade configura vínculo automaticamente","Sim, desde que previsto em contrato, após a Reforma Trabalhista","Apenas com autorização do CRECI","Somente por acordo coletivo"],correct:1,explanation:"Após a Reforma Trabalhista (art. 442-B CLT), a exclusividade e continuidade na prestação de serviço autônomo não caracterizam, por si só, vínculo."},
{category:"Direito Trabalhista",question:"Qual é a consequência de não registrar o empregado em CTPS?",options:["Apenas uma advertência verbal","Multa de R$ 3.000,00 por empregado não registrado (R$ 800,00 para ME/EPP)","Suspensão da atividade por 30 dias","Nenhuma, se houver contrato verbal"],correct:1,explanation:"A falta de registro gera multa de R$ 3.000,00 por empregado (R$ 800,00 para microempresas), conforme art. 47 da CLT."},

// ╔═══════════════════════════════════════════════════════════════╗
// ║  CATEGORIA 3: DIREITO PREVIDENCIÁRIO (30 perguntas)           ║
// ╚═══════════════════════════════════════════════════════════════╝

// -- Do material do usuário --
{category:"Direito Previdenciário",question:"Na construção civil, quem é o responsável pelo recolhimento das contribuições previdenciárias dos trabalhadores da obra?",options:["O comprador do imóvel","O corretor responsável pela venda","O dono da obra ou o construtor/empreiteiro","O cartório de registro de imóveis"],correct:2,explanation:"O dono da obra ou o construtor/empreiteiro é responsável pelo recolhimento das contribuições previdenciárias (art. 30, VI, Lei 8.212/91)."},
{category:"Direito Previdenciário",question:"O corretor de imóveis autônomo é considerado, para fins previdenciários, como:",options:["Segurado empregado","Segurado facultativo","Contribuinte individual","Segurado especial"],correct:2,explanation:"O corretor autônomo é enquadrado como contribuinte individual do INSS (art. 11, V, 'h', Lei 8.213/91)."},
{category:"Direito Previdenciário",question:"O que é a CND (Certidão Negativa de Débitos) do INSS exigida na averbação de construção?",options:["Documento que comprova a inexistência de débitos previdenciários relativos à obra","Certidão de nascimento do proprietário","Documento que comprova o pagamento do IPTU","Licença ambiental para construção"],correct:0,explanation:"A CND comprova a quitação das contribuições previdenciárias da obra, exigida para averbar a construção no Registro de Imóveis."},
{category:"Direito Previdenciário",question:"Qual é a alíquota de contribuição previdenciária do contribuinte individual (corretor autônomo) sobre o salário de contribuição?",options:["8%","11%","20%","27,5%"],correct:2,explanation:"O contribuinte individual contribui com 20% sobre o salário de contribuição (art. 21, Lei 8.212/91). A alíquota de 11% é para o plano simplificado."},
{category:"Direito Previdenciário",question:"Como funciona a aposentadoria do corretor de imóveis autônomo?",options:["Possui aposentadoria especial apenas por exercer a profissão","Pode se aposentar com 25 anos de atividade, sem contribuições","Deve contribuir como contribuinte individual e cumprir os requisitos legais vigentes","O registro no CRECI substitui as contribuições ao INSS"],correct:2,explanation:"O corretor autônomo deve contribuir como contribuinte individual ao INSS e cumprir os requisitos de aposentadoria vigentes."},

// -- Novas perguntas --
{category:"Direito Previdenciário",question:"Qual é o teto do salário de contribuição do INSS em 2026?",options:["R$ 6.433,57","R$ 7.786,02","R$ 8.157,41","R$ 10.000,00"],correct:2,explanation:"O teto do INSS é reajustado anualmente. O contribuinte individual não pode contribuir sobre base superior ao teto."},
{category:"Direito Previdenciário",question:"O que é o plano simplificado de previdência para o contribuinte individual?",options:["Contribuição de 20% sobre qualquer valor","Contribuição de 11% sobre o salário mínimo, com direito apenas à aposentadoria por idade","Isenção total de contribuição","Contribuição de 5% sobre o teto do INSS"],correct:1,explanation:"O plano simplificado permite contribuir com 11% sobre o salário mínimo, mas limita a aposentadoria por idade no valor de 1 salário mínimo."},
{category:"Direito Previdenciário",question:"O que é a matrícula CEI/CNO de uma obra de construção civil?",options:["O CNPJ da construtora","O cadastro da obra junto à Receita Federal para fins previdenciários","O registro da obra no CREA","A licença de construção da prefeitura"],correct:1,explanation:"O CNO (Cadastro Nacional de Obras) substitui o antigo CEI e vincula a obra à Receita Federal para controle das contribuições previdenciárias."},
{category:"Direito Previdenciário",question:"O que acontece se o corretor autônomo ficar mais de 12 meses sem contribuir ao INSS?",options:["Nada, a qualidade de segurado é vitalícia","Perde a qualidade de segurado e a cobertura previdenciária","Continua coberto por mais 5 anos","Recebe restituição dos valores pagos"],correct:1,explanation:"O contribuinte individual mantém qualidade de segurado por até 12 meses após cessar as contribuições (período de graça — art. 15, Lei 8.213/91)."},
{category:"Direito Previdenciário",question:"O corretor autônomo tem direito a auxílio-doença do INSS?",options:["Não, apenas empregados CLT","Sim, desde que tenha contribuído por no mínimo 12 meses (carência) e esteja em dia","Sim, sem necessidade de carência","Apenas com seguro privado"],correct:1,explanation:"O auxílio por incapacidade temporária exige carência de 12 contribuições mensais e qualidade de segurado (art. 25, I, Lei 8.213/91)."},
{category:"Direito Previdenciário",question:"O que é o fator previdenciário e como impacta a aposentadoria do corretor?",options:["Um bônus fixo de 20% sobre o benefício","Uma fórmula que considera idade, tempo de contribuição e expectativa de vida no cálculo do benefício","Um desconto obrigatório de 10%","O valor do INSS pago mensalmente"],correct:1,explanation:"O fator previdenciário é uma fórmula que pode reduzir ou aumentar o benefício, levando em conta idade, tempo de contribuição e expectativa de vida."},
{category:"Direito Previdenciário",question:"A contribuição previdenciária sobre a folha de pagamento da imobiliária é de qual percentual (cota patronal)?",options:["8%","11%","20%","27,5%"],correct:2,explanation:"A contribuição patronal sobre a folha de salários é de 20% (art. 22, I, Lei 8.212/91), além do RAT e contribuições a terceiros."},
{category:"Direito Previdenciário",question:"O que é a desoneração da folha de pagamento e qual setor do mercado imobiliário se beneficiou?",options:["Isenção total de INSS para todas as empresas","Substituição da contribuição patronal sobre a folha por contribuição sobre a receita bruta, beneficiando a construção civil","Redução do FGTS para 4%","Eliminação do 13º salário"],correct:1,explanation:"A desoneração substitui os 20% patronais sobre a folha por percentual sobre a receita bruta, beneficiando setores como construção civil."},
{category:"Direito Previdenciário",question:"O MEI (Microempreendedor Individual) pode atuar como corretor de imóveis?",options:["Sim, com registro no CRECI","Não, a atividade de corretor de imóveis não é permitida como MEI","Sim, sem necessidade de CRECI","Apenas em cidades com menos de 100 mil habitantes"],correct:1,explanation:"A atividade de corretor de imóveis não consta na lista de ocupações permitidas para MEI, pois exige registro no CRECI."},
{category:"Direito Previdenciário",question:"Qual é a regra de transição da aposentadoria por idade após a Reforma da Previdência (EC 103/2019)?",options:["65 anos para homens e mulheres","65 anos para homens e 62 anos para mulheres, com 15/20 anos de contribuição","60 anos para ambos os sexos","70 anos para todos"],correct:1,explanation:"A Reforma fixou 65 anos (homens) e 62 anos (mulheres), com tempo mínimo de contribuição de 20 anos (homens) e 15 anos (mulheres)."},
{category:"Direito Previdenciário",question:"O que é o salário de contribuição do INSS?",options:["O salário mínimo nacional","A base de cálculo sobre a qual incide a contribuição previdenciária","O valor do benefício recebido","O total de descontos na folha de pagamento"],correct:1,explanation:"Salário de contribuição é a base de cálculo da contribuição previdenciária, limitada ao teto do INSS (art. 28, Lei 8.212/91)."},
{category:"Direito Previdenciário",question:"O corretor de imóveis empregado tem a contribuição previdenciária retida pela imobiliária. Quais são as alíquotas progressivas?",options:["8%, 9% e 11%","7,5%, 9%, 12% e 14%","5%, 10% e 15%","20% fixo"],correct:1,explanation:"Após a Reforma (EC 103/2019), as alíquotas são progressivas: 7,5%, 9%, 12% e 14%, aplicadas por faixa de remuneração."},
{category:"Direito Previdenciário",question:"O que é o PPRA/PGR e qual sua relação com o mercado imobiliário?",options:["Plano de Previdência para Autônomos","Programa de Gerenciamento de Riscos, obrigatório para empresas da construção civil","Plano de Pagamento de Receitas Acessórias","Programa de Promoção de Regularização de Áreas"],correct:1,explanation:"O PGR (antigo PPRA) é obrigatório para identificar e controlar riscos ambientais no ambiente de trabalho, especialmente na construção civil."},
{category:"Direito Previdenciário",question:"O que é a aposentadoria especial e ela se aplica a corretores de imóveis?",options:["Aposentadoria aos 50 anos para qualquer profissão","Aposentadoria para quem trabalha exposto a agentes nocivos — não se aplica a corretores","Aposentadoria antecipada para mulheres corretoras","Aposentadoria por invalidez para acidentes de trabalho"],correct:1,explanation:"A aposentadoria especial é para trabalhadores expostos a agentes nocivos (15, 20 ou 25 anos). Não se aplica à atividade de corretagem imobiliária."},
{category:"Direito Previdenciário",question:"Qual documento comprova o tempo de contribuição do corretor autônomo ao INSS?",options:["Carteira do CRECI","Guias de recolhimento (GPS/DARF) e CNIS","Declaração do imposto de renda","Contrato de prestação de serviços"],correct:1,explanation:"O tempo de contribuição é comprovado pelas guias de pagamento e pelo CNIS (Cadastro Nacional de Informações Sociais)."},
{category:"Direito Previdenciário",question:"O que é o RAT (Riscos Ambientais do Trabalho) e como impacta construtoras e imobiliárias?",options:["Imposto sobre renda de aluguéis","Contribuição adicional ao INSS baseada no grau de risco da atividade da empresa","Relatório Anual de Tributação","Registro de Acidentes de Trânsito"],correct:1,explanation:"O RAT é uma contribuição patronal adicional (1%, 2% ou 3%) ao INSS, baseada no grau de risco da atividade — construção civil tem alíquota maior."},

// ╔═══════════════════════════════════════════════════════════════╗
// ║  CATEGORIA 4: DIREITO SOCIETÁRIO (35 perguntas)               ║
// ╚═══════════════════════════════════════════════════════════════╝

// -- Do material do usuário --
{category:"Direito Societário",question:"Qual tipo societário é o mais utilizado no Brasil e exige capital social dividido em quotas?",options:["Sociedade Anônima (S.A.)","Sociedade Limitada (Ltda.)","Sociedade em Comandita Simples","Sociedade em Nome Coletivo"],correct:1,explanation:"A Sociedade Limitada é o tipo mais comum no Brasil, com capital dividido em quotas e responsabilidade limitada dos sócios."},
{category:"Direito Societário",question:"Qual é o órgão responsável pelo registro de uma Sociedade Limitada?",options:["Cartório de Registro de Títulos e Documentos","Junta Comercial do Estado","Cartório de Registro de Imóveis","Receita Federal do Brasil"],correct:1,explanation:"As sociedades empresárias, incluindo a Ltda., são registradas na Junta Comercial (art. 1.150 CC e Lei 8.934/94)."},
{category:"Direito Societário",question:"Na Sociedade Limitada, a responsabilidade dos sócios é limitada a quê?",options:["Ao valor de suas quotas apenas","Ao total do capital social, solidariamente, até sua integralização","Ao patrimônio pessoal de cada sócio","Ao dobro do valor investido"],correct:1,explanation:"Os sócios respondem solidariamente pela integralização do capital social. Após integralizado, a responsabilidade é limitada ao valor das quotas (art. 1.052 CC)."},
{category:"Direito Societário",question:"O que é a desconsideração da personalidade jurídica prevista no art. 50 do Código Civil?",options:["A extinção da empresa por decisão judicial","A suspensão temporária do CNPJ","A responsabilização dos sócios por obrigações da empresa em caso de abuso","A mudança do tipo societário por determinação do juiz"],correct:2,explanation:"A desconsideração permite alcançar o patrimônio pessoal dos sócios quando há abuso da personalidade jurídica, desvio de finalidade ou confusão patrimonial."},
{category:"Direito Societário",question:"Qual é a principal finalidade de uma holding patrimonial no contexto imobiliário?",options:["Administrar folha de pagamento dos funcionários","Concentrar a titularidade de bens imóveis para planejamento sucessório e tributário","Emitir ações na Bolsa de Valores","Obter financiamento junto ao BNDES"],correct:1,explanation:"A holding patrimonial concentra imóveis em pessoa jurídica, facilitando o planejamento sucessório, tributário e a proteção patrimonial."},
{category:"Direito Societário",question:"Qual vantagem tributária uma holding patrimonial pode oferecer na locação de imóveis em relação à pessoa física?",options:["Isenção total de tributos","Alíquota efetiva de tributos sobre receita de aluguel pode ser menor pelo Lucro Presumido","Não incide nenhum imposto sobre aluguel recebido por holding","O IPTU é isento para holdings"],correct:1,explanation:"No Lucro Presumido, a alíquota efetiva sobre aluguéis pode ser em torno de 11-14%, enquanto pessoa física pode pagar até 27,5% de IRPF."},
{category:"Direito Societário",question:"Qual tipo societário é mais comum para constituição de uma holding familiar?",options:["Sociedade Anônima de capital aberto","Empresa Individual de Responsabilidade Limitada (EIRELI)","Sociedade Limitada (Ltda.)","Cooperativa"],correct:2,explanation:"A Sociedade Limitada é a mais usada para holdings familiares pela flexibilidade do contrato social e limitação de responsabilidade."},

// -- Novas perguntas --
{category:"Direito Societário",question:"O que é a SPE (Sociedade de Propósito Específico) no mercado imobiliário?",options:["Uma sociedade sem fins lucrativos","Sociedade criada para um empreendimento específico, isolando riscos","Uma cooperativa de moradores","Uma empresa estatal de habitação"],correct:1,explanation:"A SPE é constituída para um empreendimento específico, isolando seu patrimônio e riscos dos demais negócios dos sócios."},
{category:"Direito Societário",question:"O que é o SCP (Sociedade em Conta de Participação) e como é usada no mercado imobiliário?",options:["Sociedade registrada na Junta Comercial para construção","Sociedade não personificada entre um sócio ostensivo e sócios participantes, usada para investimentos imobiliários","Consórcio de construtoras","Cooperativa habitacional"],correct:1,explanation:"A SCP é sociedade sem personalidade jurídica onde o sócio ostensivo opera e os participantes investem, comum em empreendimentos imobiliários (arts. 991 a 996 CC)."},
{category:"Direito Societário",question:"O que é o acordo de sócios (ou quotistas) em uma holding imobiliária?",options:["O contrato social registrado na Junta","Documento que regulamenta direitos, obrigações e restrições entre os sócios além do contrato social","A procuração para o administrador","O plano de negócios da empresa"],correct:1,explanation:"O acordo de sócios é instrumento parassocial que regula temas como distribuição de lucros, governança e restrições à transferência de quotas."},
{category:"Direito Societário",question:"O que é a cláusula de incomunicabilidade das quotas em uma holding familiar?",options:["As quotas não podem ser vendidas","As quotas não se comunicam ao cônjuge do sócio em caso de casamento ou divórcio","As quotas não pagam imposto","As quotas não podem ser penhoradas"],correct:1,explanation:"A incomunicabilidade impede que as quotas se comuniquem ao patrimônio do cônjuge, protegendo o patrimônio familiar em caso de separação."},
{category:"Direito Societário",question:"O que é a affectio societatis?",options:["O endereço da sede social","A vontade e disposição dos sócios de se unirem e permanecerem associados para alcançar um objetivo comum","O capital social mínimo","A responsabilidade dos sócios"],correct:1,explanation:"Affectio societatis é o elemento volitivo que representa a intenção dos sócios em colaborar para o sucesso da sociedade."},
{category:"Direito Societário",question:"Qual é a vantagem de integralizar imóveis no capital social de uma holding patrimonial?",options:["O imóvel fica isento de IPTU para sempre","Pode-se transferir os imóveis com alíquota reduzida de ITBI ou mesmo isenção, dependendo do município","O imóvel dobra de valor automaticamente","Não há nenhuma vantagem"],correct:1,explanation:"A integralização de imóveis ao capital social pode ter isenção ou redução de ITBI em diversos municípios (art. 156, §2º, I, CF), exceto se a atividade preponderante for imobiliária."},
{category:"Direito Societário",question:"Quando a isenção de ITBI na integralização de imóveis ao capital NÃO se aplica?",options:["Quando o imóvel vale mais de R$ 1 milhão","Quando a atividade preponderante da empresa for compra, venda ou locação de imóveis","Quando houver mais de 3 sócios","Quando a holding for Ltda. ao invés de S.A."],correct:1,explanation:"Se a atividade preponderante da empresa for imobiliária (compra, venda, locação), a imunidade de ITBI não se aplica (art. 37, CF e art. 156, §2º, I, CF)."},
{category:"Direito Societário",question:"O que é o pro labore na administração de uma holding imobiliária?",options:["O lucro distribuído aos sócios","A remuneração paga ao sócio-administrador pelo trabalho de gestão","O valor das quotas de cada sócio","A taxa de administração do condomínio"],correct:1,explanation:"Pro labore é a remuneração do sócio-administrador pelo trabalho efetivo de gestão da empresa, sujeito a INSS e IRPF."},
{category:"Direito Societário",question:"O que é o planejamento sucessório por meio de holding familiar?",options:["Venda antecipada dos imóveis","Organização da transferência patrimonial em vida, via doação de quotas com usufruto, evitando inventário","Seguro de vida para os herdeiros","Testamento registrado em cartório"],correct:1,explanation:"A holding familiar permite a doação antecipada de quotas com reserva de usufruto, facilitando a sucessão e evitando o inventário judicial."},
{category:"Direito Societário",question:"O que é a cláusula de usufruto vitalício sobre quotas da holding?",options:["O sócio vende suas quotas e continua usando os imóveis","O doador transfere as quotas mas mantém o direito de receber rendimentos e administrar a sociedade até o falecimento","As quotas são devolvidas após 10 anos","O sócio menor recebe dividendos antecipados"],correct:1,explanation:"O usufruto permite que o doador das quotas mantenha o controle da holding e o direito aos frutos (aluguéis, lucros) durante sua vida."},
{category:"Direito Societário",question:"Qual é a diferença entre distribuição de lucros e pro labore para fins tributários?",options:["Não há diferença tributária","Lucros distribuídos são isentos de IR para o sócio PF; pro labore é tributado como renda (IRPF + INSS)","Pro labore é isento e lucros são tributados","Ambos pagam a mesma alíquota de 15%"],correct:1,explanation:"Lucros distribuídos por PJ são isentos de IRPF na pessoa do sócio. O pro labore é tributado pelo IRPF (tabela progressiva) e INSS."},
{category:"Direito Societário",question:"O que é a dissolução parcial de sociedade e quando ocorre no contexto de holdings?",options:["Encerramento total da empresa","Saída de um sócio com apuração de haveres, sem extinção da sociedade","Fusão com outra empresa","Mudança de endereço da sede"],correct:1,explanation:"A dissolução parcial permite a saída de sócio (ou exclusão) com apuração de seus haveres, mantendo a sociedade em funcionamento (arts. 1.028 a 1.032 CC)."},
{category:"Direito Societário",question:"O que é a SLU (Sociedade Limitada Unipessoal)?",options:["Sociedade com no mínimo 5 sócios","Sociedade limitada formada por apenas um sócio, permitida desde 2019","Sociedade anônima com um acionista","Sociedade estrangeira registrada no Brasil"],correct:1,explanation:"A SLU permite a constituição de sociedade limitada por um único sócio, eliminando a necessidade de sócio 'de fachada' (art. 1.052, §1º, CC, Lei 13.874/2019)."},
{category:"Direito Societário",question:"Na holding patrimonial, o que é o regime tributário do Lucro Presumido?",options:["Tributação sobre o lucro contábil real","Regime simplificado que presume o lucro com base em percentual da receita bruta","Isenção total de impostos para holdings","Regime exclusivo para microempresas"],correct:1,explanation:"No Lucro Presumido, o lucro é presumido com base em percentuais sobre a receita bruta (32% para aluguéis, 8% para venda de imóveis), simplificando a apuração."},
{category:"Direito Societário",question:"Qual é o quórum para alteração do contrato social de uma Sociedade Limitada?",options:["Maioria simples (50%+1)","3/4 do capital social","Unanimidade dos sócios","2/3 do capital social"],correct:1,explanation:"A alteração do contrato social exige aprovação de sócios que representem, no mínimo, 3/4 (75%) do capital social (art. 1.076, I, CC)."},

// ╔═══════════════════════════════════════════════════════════════╗
// ║  CATEGORIA 5: DIREITO TRIBUTÁRIO (35 perguntas)               ║
// ╚═══════════════════════════════════════════════════════════════╝

// -- Do material do usuário --
{category:"Direito Tributário",question:"Qual imposto incide sobre a transmissão de bens imóveis por ato inter vivos (compra e venda)?",options:["ITCMD","IPTU","ITBI","ISS"],correct:2,explanation:"O ITBI (Imposto de Transmissão de Bens Imóveis) incide sobre transações onerosas de imóveis, de competência municipal (art. 156, II, CF)."},
{category:"Direito Tributário",question:"No Lucro Presumido, qual é a base de presunção para atividades imobiliárias de compra e venda?",options:["32% da receita bruta","8% da receita bruta","12% da receita bruta","16% da receita bruta"],correct:1,explanation:"Para venda de imóveis no Lucro Presumido, a base de presunção do IRPJ é 8% da receita bruta (art. 15, Lei 9.249/95)."},
{category:"Direito Tributário",question:"O ITCMD (Imposto sobre Transmissão Causa Mortis e Doação) é de competência de qual ente federativo?",options:["União","Municípios","Estados e Distrito Federal","Autarquias federais"],correct:2,explanation:"O ITCMD é de competência dos Estados e do Distrito Federal (art. 155, I, CF)."},

// -- Novas perguntas --
{category:"Direito Tributário",question:"Qual é a alíquota máxima do ITCMD segundo a Constituição Federal?",options:["4%","8%","15%","20%"],correct:1,explanation:"O Senado Federal fixou a alíquota máxima do ITCMD em 8% (Resolução 9/92). Cada estado define sua alíquota dentro desse limite."},
{category:"Direito Tributário",question:"O que é o ganho de capital na venda de imóveis por pessoa física e qual a alíquota?",options:["Diferença entre valor de compra e venda, tributada a 15%","O valor total da venda, tributado a 27,5%","Apenas o valor acima de R$ 1 milhão, tributado a 10%","Não há tributação sobre venda de imóveis"],correct:0,explanation:"O ganho de capital (lucro na venda) é tributado a 15% para ganhos até R$ 5 milhões, com alíquotas progressivas acima disso (Lei 8.981/95)."},
{category:"Direito Tributário",question:"Em qual situação a pessoa física é ISENTA de imposto sobre ganho de capital na venda de imóvel residencial?",options:["Quando vende imóvel comercial","Quando utiliza o produto da venda para adquirir outro imóvel residencial em até 180 dias","Quando o imóvel foi adquirido há mais de 5 anos","Quando o valor da venda é inferior a R$ 100 mil"],correct:1,explanation:"Há isenção se o valor da venda de imóvel residencial for integralmente utilizado na compra de outro imóvel residencial em 180 dias (art. 39, Lei 11.196/2005)."},
{category:"Direito Tributário",question:"Imóvel adquirido antes de 1969 por pessoa física possui qual benefício fiscal na venda?",options:["Alíquota reduzida de 5%","Isenção total do imposto sobre ganho de capital","Parcelamento do imposto em 120 meses","Dedução de 50% do valor venal"],correct:1,explanation:"Imóveis adquiridos até 1969 têm redução de 100% do ganho de capital (fator de redução previsto no art. 18, Lei 7.713/88)."},
{category:"Direito Tributário",question:"O que é o IPTU progressivo no tempo previsto no Estatuto da Cidade?",options:["Aumento anual automático do IPTU de todos os imóveis","Alíquota crescente para imóveis urbanos que não cumprem a função social da propriedade","Desconto para aposentados","Isenção para imóveis em áreas de risco"],correct:1,explanation:"O IPTU progressivo no tempo é aplicado a imóveis que não atendem à função social, com alíquotas crescentes por até 5 anos (art. 7º, Estatuto da Cidade)."},
{category:"Direito Tributário",question:"Qual é a base de presunção do IRPJ no Lucro Presumido para receitas de aluguel de imóveis?",options:["8%","12%","32%","16%"],correct:2,explanation:"Para receitas de aluguel e prestação de serviços em geral, a base de presunção do IRPJ é 32% da receita bruta (art. 15, §1º, III, 'a', Lei 9.249/95)."},
{category:"Direito Tributário",question:"Qual é a alíquota do IRPJ sobre o lucro presumido?",options:["10%","15%","20%","25%"],correct:1,explanation:"A alíquota do IRPJ é de 15% sobre o lucro presumido, com adicional de 10% sobre o excedente de R$ 20 mil/mês (art. 3º, Lei 9.249/95)."},
{category:"Direito Tributário",question:"O que é a CSLL e como incide sobre empresas do mercado imobiliário?",options:["Contribuição Social sobre Lucros Líquidos — incide sobre o lucro da empresa","Certidão Social de Licença para Locação","Contribuição Sindical de Livre Licitação","Cadastro Social de Locadores Legais"],correct:0,explanation:"A CSLL incide sobre o lucro das empresas à alíquota de 9%, sendo base presumida de 12% (venda) ou 32% (aluguéis) no Lucro Presumido."},
{category:"Direito Tributário",question:"Quais tributos federais incidem sobre a receita de aluguel recebida por holding imobiliária no Lucro Presumido?",options:["Apenas IRPJ","IRPJ, CSLL, PIS e COFINS","Apenas ISS e IPTU","ICMS e IPI"],correct:1,explanation:"No Lucro Presumido, incidem IRPJ (15%), CSLL (9% sobre base presumida), PIS (0,65%) e COFINS (3%) sobre a receita."},
{category:"Direito Tributário",question:"O PIS e COFINS cumulativos no Lucro Presumido incidem sobre aluguel de imóveis com quais alíquotas?",options:["1,65% e 7,6%","0,65% e 3%","2% e 5%","0% (isentos)"],correct:1,explanation:"No regime cumulativo (Lucro Presumido), PIS é 0,65% e COFINS é 3% sobre a receita bruta (Leis 9.718/98, 10.637/02 e 10.833/03)."},
{category:"Direito Tributário",question:"O que é o ITR e quem é obrigado a pagá-lo?",options:["Imposto sobre Transações Rurais — pago por compradores","Imposto Territorial Rural — pago por proprietários de imóveis rurais","Imposto de Transmissão de Registros — pago por cartórios","Índice de Transferência Registral — usado por avaliadores"],correct:1,explanation:"O ITR é imposto federal sobre a propriedade rural (art. 153, VI, CF), pago anualmente pelo proprietário."},
{category:"Direito Tributário",question:"O que é o RET (Regime Especial de Tributação) para incorporações imobiliárias?",options:["Regime que tributa a 27,5% o lucro das incorporadoras","Regime que unifica IRPJ, CSLL, PIS e COFINS em alíquota única de 4% sobre receitas do empreendimento","Regime de isenção para construtoras de habitação popular","Regime de tributação sobre remessas ao exterior"],correct:1,explanation:"O RET permite tributação unificada de 4% sobre receitas da incorporação (1% para MCMV), mediante patrimônio de afetação (Lei 10.931/2004)."},
{category:"Direito Tributário",question:"O que é o come-cotas nos fundos imobiliários?",options:["Desconto semestral de IR que reduz a quantidade de cotas","Não existe come-cotas em FIIs — os rendimentos distribuídos são isentos de IR para PF","Taxa de administração cobrada em cotas","Imposto sobre compra de novas cotas"],correct:1,explanation:"FIIs não têm come-cotas. Rendimentos distribuídos são isentos de IR para pessoa física (com condições), mas o ganho de capital na venda de cotas é tributado a 20%."},
{category:"Direito Tributário",question:"Qual é a alíquota do imposto de renda sobre ganho de capital na venda de cotas de FII?",options:["15%","20%","10%","27,5%"],correct:1,explanation:"O ganho de capital na alienação de cotas de FII é tributado à alíquota de 20% (art. 2º, Lei 11.033/2004)."},
{category:"Direito Tributário",question:"O que é a isenção do ganho de capital na venda de imóvel de até R$ 440 mil para pessoa física?",options:["Qualquer imóvel até esse valor é isento","Isenção se for o único imóvel do vendedor e ele não tiver vendido outro nos últimos 5 anos","Isenção apenas para imóveis rurais","Não existe essa isenção"],correct:1,explanation:"A venda de imóvel de até R$ 440 mil é isenta se for o único imóvel do contribuinte e não tenha havido outra alienação nos últimos 5 anos (art. 23, Lei 9.250/95)."},
{category:"Direito Tributário",question:"O que é o DIMOB e quem é obrigado a apresentá-lo?",options:["Declaração de Imóveis Mobiliados — para locadores","Declaração de Informações sobre Atividades Imobiliárias — obrigatória para imobiliárias e incorporadoras","Documento de Inscrição Municipal de Obras e Benfeitorias","Demonstrativo de Impostos Municipais sobre Bens"],correct:1,explanation:"O DIMOB é a declaração anual à Receita Federal das operações imobiliárias realizadas por imobiliárias, incorporadoras e administradoras de imóveis (IN RFB 1.115/2010)."},

