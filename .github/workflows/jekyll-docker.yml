// -- Direito Imobiliário (extras) --
{category:"Direito Imobiliário",question:"O que é a ação de despejo por falta de pagamento?",options:["Ação para cobrar IPTU em atraso","Ação judicial para retomar o imóvel locado quando o inquilino não paga aluguel","Ação para demolir construção irregular","Processo de execução fiscal"],correct:1,explanation:"A ação de despejo por falta de pagamento permite ao locador retomar o imóvel e cobrar aluguéis em atraso (art. 9º, III, Lei 8.245/91)."},
{category:"Direito Imobiliário",question:"O que é o direito de arrependimento na compra de imóvel na planta?",options:["O comprador pode desistir a qualquer momento sem penalidade","O comprador pode desistir em até 7 dias se a compra ocorreu fora do estabelecimento comercial","Não existe direito de arrependimento para imóveis","O vendedor pode cancelar a venda em até 30 dias"],correct:1,explanation:"O direito de arrependimento de 7 dias aplica-se quando a aquisição ocorre fora do estabelecimento comercial (art. 49, CDC), como em feirões."},
{category:"Direito Imobiliário",question:"O que é o Fundo de Investimento Imobiliário (FII)?",options:["Poupança vinculada a imóveis","Comunhão de recursos de investidores aplicados em empreendimentos imobiliários, com cotas negociadas em bolsa","Financiamento coletivo para construção","Consórcio de imóveis"],correct:1,explanation:"O FII é um veículo de investimento coletivo em imóveis ou títulos imobiliários, com cotas negociáveis em bolsa (Lei 8.668/93)."},
{category:"Direito Imobiliário",question:"Qual é o prazo de garantia do construtor para vícios ocultos após a entrega do imóvel?",options:["30 dias","90 dias","5 anos pela garantia legal do CC, podendo chegar a 10 anos por jurisprudência","1 ano"],correct:2,explanation:"O CC prevê garantia de 5 anos pela solidez (art. 618). A jurisprudência permite reclamação em até 10 anos (5 de garantia + 5 de prescrição)."},
{category:"Direito Imobiliário",question:"O que é a convenção de condomínio?",options:["Reunião mensal dos condôminos","Documento que estabelece as regras de uso e administração do condomínio edilício","O contrato de locação do salão de festas","O projeto arquitetônico do prédio"],correct:1,explanation:"A convenção de condomínio é o ato normativo que disciplina direitos e deveres dos condôminos, aprovada por 2/3 das frações ideais (art. 1.333 CC)."},
{category:"Direito Imobiliário",question:"O condômino inadimplente pode ser impedido de usar áreas comuns do condomínio?",options:["Sim, pode ser impedido de usar qualquer área","Não, o uso das áreas comuns é inerente à propriedade e não pode ser restringido como punição por inadimplência","Apenas se a convenção autorizar","Somente após decisão judicial"],correct:1,explanation:"O STJ entende que restringir o uso de áreas comuns como punição ao inadimplente é abusivo, pois o direito de uso decorre da propriedade."},
{category:"Direito Imobiliário",question:"O que é a REURB (Regularização Fundiária Urbana)?",options:["Reforma de imóveis antigos","Conjunto de medidas jurídicas e urbanísticas para regularizar assentamentos informais","Recadastramento de contribuintes do IPTU","Renovação de licenças ambientais"],correct:1,explanation:"A REURB (Lei 13.465/2017) compreende medidas para formalizar a propriedade em áreas ocupadas irregularmente."},
{category:"Direito Imobiliário",question:"O que é o direito de vizinhança no Código Civil?",options:["Obrigação de cumprimentar os vizinhos","Conjunto de normas que regulam os conflitos entre proprietários de imóveis contíguos","Lei municipal sobre barulho","Direito de usar a piscina do vizinho"],correct:1,explanation:"O direito de vizinhança regula uso anormal da propriedade, árvores limítrofes, passagem forçada, entre outros (arts. 1.277 a 1.313 CC)."},

// -- Direito Trabalhista (extras) --
{category:"Direito Trabalhista",question:"O que são as horas in itinere e elas se aplicam ao corretor de imóveis?",options:["Horas extras noturnas","Tempo de deslocamento casa-trabalho que era computado como jornada — suprimido pela Reforma Trabalhista","Intervalo para almoço","Horas de treinamento obrigatório"],correct:1,explanation:"As horas in itinere foram suprimidas pela Reforma Trabalhista (art. 58, §2º, CLT). O tempo de deslocamento não é mais computado na jornada."},
{category:"Direito Trabalhista",question:"O que é o teletrabalho (home office) e como se aplica ao mercado imobiliário?",options:["Trabalho realizado apenas por telefone","Prestação de serviços fora das dependências do empregador, com uso de tecnologia, previsto na CLT","Trabalho em tempo parcial","Estágio remoto"],correct:1,explanation:"O teletrabalho é regulado pelos arts. 75-A a 75-F da CLT, aplicável a funções administrativas de imobiliárias."},
{category:"Direito Trabalhista",question:"O que é a terceirização e como impacta as imobiliárias?",options:["Contratação de estagiários","Contratação de empresa para realizar serviços, permitida para qualquer atividade após a Reforma Trabalhista","Sublocação de imóveis","Contratação de freelancers sem contrato"],correct:1,explanation:"A terceirização é permitida para qualquer atividade (inclusive atividade-fim) após a Lei 13.429/2017 e Reforma Trabalhista."},
{category:"Direito Trabalhista",question:"Qual é o adicional de insalubridade e ele pode ser aplicável a trabalhadores da construção civil?",options:["5% sobre o salário base","10%, 20% ou 40% sobre o salário mínimo, dependendo do grau, aplicável a trabalhadores expostos a agentes nocivos na construção","50% sobre horas extras","Não existe mais após a Reforma"],correct:1,explanation:"O adicional de insalubridade é de 10% (mínimo), 20% (médio) ou 40% (máximo), aplicável a trabalhadores expostos a agentes nocivos (art. 192 CLT)."},
{category:"Direito Trabalhista",question:"O que é o banco de horas e como funciona na imobiliária?",options:["Conta bancária para depósito de salários","Sistema de compensação que permite acumular horas extras para folga posterior","Empréstimo de horas entre funcionários","Registro de horas no CRECI"],correct:1,explanation:"O banco de horas permite compensação de horas extras por folgas, podendo ser acordado individualmente por até 6 meses (art. 59, §5º, CLT)."},
{category:"Direito Trabalhista",question:"O que é a estabilidade provisória da gestante e como se aplica em imobiliárias?",options:["A gestante não pode ser demitida durante a gravidez e até 5 meses após o parto","A gestante pode ser demitida com aviso prévio de 90 dias","A estabilidade só vale para empregadas públicas","Não existe estabilidade para gestantes no setor privado"],correct:0,explanation:"A empregada gestante tem estabilidade desde a confirmação da gravidez até 5 meses após o parto (art. 10, II, 'b', ADCT)."},

// -- Direito Previdenciário (extras) --
{category:"Direito Previdenciário",question:"O que é a pensão por morte do INSS e o dependente do corretor autônomo tem direito?",options:["Apenas empregados CLT geram pensão por morte","Sim, desde que o corretor esteja em dia com as contribuições, seus dependentes têm direito","Somente se o corretor tiver mais de 20 anos de contribuição","Apenas cônjuges têm direito"],correct:1,explanation:"A pensão por morte é devida aos dependentes do segurado que mantinha qualidade de segurado (contribuições em dia) ao falecer (art. 74, Lei 8.213/91)."},
{category:"Direito Previdenciário",question:"O que é o auxílio-acidente e o corretor de imóveis empregado tem direito?",options:["Benefício por qualquer tipo de acidente","Indenização mensal para segurado que, após acidente, tem capacidade reduzida para o trabalho","Seguro de vida obrigatório","Adicional por trabalho noturno"],correct:1,explanation:"O auxílio-acidente é uma indenização paga ao segurado que sofre acidente e fica com sequelas que reduzem sua capacidade laboral (art. 86, Lei 8.213/91)."},
{category:"Direito Previdenciário",question:"O que é a contribuição previdenciária sobre a receita bruta (CPRB) e como afeta a construção civil?",options:["Contribuição de 20% sobre a folha","Substituição da contribuição patronal sobre folha por contribuição sobre receita bruta da empresa","Contribuição do empregado sobre seu salário","Imposto sobre aluguel de equipamentos"],correct:1,explanation:"A CPRB substitui os 20% patronais sobre a folha por 1% a 4,5% sobre a receita bruta, beneficiando setores como a construção civil."},

// -- Direito Societário (extras) --
{category:"Direito Societário",question:"O que é a cláusula de não-competição em um contrato societário de imobiliária?",options:["Proibição de anunciar imóveis online","Cláusula que impede o sócio retirante de atuar no mesmo ramo e região por período determinado","Acordo para não competir em leilões","Restrição de vendas em determinados bairros"],correct:1,explanation:"A cláusula de não-competição restringe o sócio retirante de concorrer no mesmo segmento por prazo e área geográfica definidos."},
{category:"Direito Societário",question:"O que é o conselho de administração em uma incorporadora S.A.?",options:["Grupo de moradores do condomínio","Órgão colegiado que define as diretrizes estratégicas da companhia","Departamento de recursos humanos","Comissão de corretores"],correct:1,explanation:"O conselho de administração é o órgão de deliberação colegiada que fixa a orientação geral dos negócios da S.A. (art. 138, Lei 6.404/76)."},
{category:"Direito Societário",question:"O que é a golden share (ação de classe especial)?",options:["Ação que paga dividendos em ouro","Ação que confere poder de veto em certas deliberações ao seu titular","Ação mais cara do mercado","Ação sem direito a voto"],correct:1,explanation:"A golden share confere ao titular (geralmente o Estado em privatizações) poder de veto em matérias específicas (art. 17, §7º, Lei 6.404/76)."},
{category:"Direito Societário",question:"O que é a joint venture no mercado imobiliário?",options:["Compra conjunta de imóvel por duas famílias","Associação entre empresas para realizar um empreendimento específico, compartilhando riscos e lucros","Fusão definitiva de duas construtoras","Leilão de imóveis em conjunto"],correct:1,explanation:"Joint venture é a associação temporária entre empresas para desenvolver um projeto imobiliário específico, sem criar nova pessoa jurídica."},
{category:"Direito Societário",question:"Qual é a responsabilidade do administrador de uma holding patrimonial perante terceiros?",options:["Responsabilidade ilimitada sempre","Não responde pessoalmente se agir dentro de seus poderes e sem culpa ou dolo","Responde até o limite de 50% do capital social","Responde apenas por dívidas trabalhistas"],correct:1,explanation:"O administrador que age nos limites de seus poderes e sem culpa ou dolo não responde pessoalmente pelas obrigações da sociedade (art. 1.012 CC)."},

// -- Direito Tributário (extras) --
{category:"Direito Tributário",question:"O que é a isenção de IR sobre aluguel recebido por pessoa física até o limite da tabela?",options:["Todo aluguel é isento de IR","O aluguel recebido por PF é tributado pelo IRPF conforme tabela progressiva, sendo isento até o limite de isenção mensal","Aluguel de até R$ 10 mil é isento","Não existe isenção para renda de aluguel"],correct:1,explanation:"A renda de aluguel PF compõe a base de cálculo do IRPF mensal (carnê-leão), sendo isenta até o limite da faixa de isenção da tabela."},
{category:"Direito Tributário",question:"O que é o carnê-leão para locadores pessoa física?",options:["Caderno de controle de aluguéis","Recolhimento mensal obrigatório de IRPF sobre aluguéis recebidos de pessoas físicas","Imposto pago apenas na declaração anual","Taxa municipal sobre locação"],correct:1,explanation:"O carnê-leão é o recolhimento mensal do IRPF que o locador PF deve fazer ao receber aluguel de outras pessoas físicas (art. 106, IN RFB 1.500/2014)."},
{category:"Direito Tributário",question:"Qual é a alíquota do ISS sobre serviços de corretagem imobiliária?",options:["Não incide ISS sobre corretagem","De 2% a 5%, conforme legislação do município","10% fixo","15% sobre o valor da comissão"],correct:1,explanation:"O ISS incide sobre serviços de corretagem imobiliária com alíquota entre 2% e 5%, definida por cada município (LC 116/2003)."},
{category:"Direito Tributário",question:"O que é o ITCMD progressivo e como impacta o planejamento sucessório?",options:["É um imposto federal com alíquota fixa","Imposto estadual com alíquotas crescentes conforme o valor da herança/doação, incentivando o planejamento antecipado","É cobrado apenas sobre imóveis rurais","Não existe progressividade no ITCMD"],correct:1,explanation:"Com a EC 132/2023, o ITCMD passou a ser obrigatoriamente progressivo, tornando o planejamento sucessório (holdings, doações em vida) mais relevante."},
{category:"Direito Tributário",question:"O que é o laudêmio cobrado em terrenos de marinha?",options:["Imposto sobre imóveis à beira-mar","Taxa paga à União pela transferência de domínio útil de imóvel em terreno de marinha","Aluguel de praia pela prefeitura","Imposto sobre embarcações"],correct:1,explanation:"O laudêmio é a taxa de 5% sobre o valor do imóvel paga à União na transferência de domínio útil em terrenos de marinha (Decreto-Lei 9.760/46)."},
{category:"Direito Tributário",question:"O que é a taxa de ocupação cobrada em terrenos de marinha?",options:["O percentual do terreno que pode ser construído","Valor anual pago à União pelo uso de terreno de marinha por ocupante regular","Imposto municipal sobre ocupação do solo","Taxa de condomínio em prédios à beira-mar"],correct:1,explanation:"A taxa de ocupação é cobrada anualmente pela SPU dos ocupantes regulares de terrenos de marinha (2% ou 5% do valor do terreno)."},
{category:"Direito Tributário",question:"O que é o GCap (Programa de Ganhos de Capital) da Receita Federal?",options:["Sistema de gestão de carteiras de investimento","Programa para apurar e calcular o imposto de renda sobre ganho de capital na venda de imóveis","Cadastro geral de propriedades","Sistema de avaliação de imóveis"],correct:1,explanation:"O GCap é o programa da Receita Federal usado para calcular o IR sobre ganho de capital na alienação de bens, incluindo imóveis."},

// -- Reforma Tributária (extras) --
{category:"Reforma Tributária",question:"O cashback (devolução de tributos) da Reforma Tributária beneficia quais famílias no setor imobiliário?",options:["Todas as famílias, independente de renda","Famílias de baixa renda inscritas no CadÚnico, incluindo para serviços de locação e concessionárias","Apenas famílias com renda acima de 10 salários mínimos","Somente compradores de imóvel próprio"],correct:1,explanation:"O cashback devolve parte do IBS/CBS pago por famílias de baixa renda (CadÚnico), incluindo gastos com moradia (aluguel, contas)."},
{category:"Reforma Tributária",question:"Como a Reforma Tributária impacta os contratos de locação vigentes na data da transição?",options:["Todos são automaticamente rescindidos","Os contratos em vigor precisarão ser adaptados para contemplar a incidência do IBS/CBS sobre o aluguel","Nenhum impacto, a reforma não atinge contratos existentes","Apenas contratos acima de R$ 5 mil são afetados"],correct:1,explanation:"Contratos de locação vigentes precisarão prever a nova incidência tributária, podendo impactar o valor final pago pelo locatário."},
{category:"Reforma Tributária",question:"O que é o regime de transição do IBS para o mercado imobiliário entre 2029 e 2033?",options:["Cobrança integral desde 2029","Aumento gradual da alíquota do IBS com redução proporcional do ICMS e ISS até 2033","Isenção total durante a transição","Apenas construtoras pagam durante a transição"],correct:1,explanation:"Entre 2029 e 2032, o IBS sobe gradualmente enquanto ICMS e ISS diminuem proporcionalmente, completando a substituição em 2033."},
{category:"Reforma Tributária",question:"A Reforma Tributária criou o IVA dual. O que isso significa?",options:["Dois impostos sobre o mesmo fato gerador","A existência de dois tributos sobre valor agregado: IBS (subnacional) e CBS (federal), com regras harmonizadas","Tributação em dobro para grandes empresas","Cobrança duplicada que será corrigida em 2030"],correct:1,explanation:"O IVA dual brasileiro consiste no IBS (estadual/municipal) e CBS (federal), com bases, regras e alíquotas harmonizadas, mas gestão separada."},
{category:"Reforma Tributária",question:"Como a nota fiscal eletrônica será impactada pela Reforma Tributária no setor imobiliário?",options:["A nota fiscal será eliminada","Todas as operações imobiliárias passarão a exigir nota fiscal eletrônica com discriminação do IBS/CBS","Apenas vendas acima de R$ 1 milhão precisarão de nota","A nota fiscal será substituída pelo CIB"],correct:1,explanation:"A Reforma prevê integração total via nota fiscal eletrônica, com discriminação dos tributos (IBS/CBS), facilitando o controle e a transparência."},

// -- Últimas perguntas para completar 200+ --
{category:"Direito Imobiliário",question:"O que é a ação reivindicatória?",options:["Ação para cobrar aluguel atrasado","Ação do proprietário para retomar a posse de imóvel detido injustamente por terceiro","Ação para registrar imóvel no cartório","Ação para dividir herança"],correct:1,explanation:"A ação reivindicatória é o meio pelo qual o proprietário reivindica o bem de quem injustamente o possua (art. 1.228 CC)."},
{category:"Direito Imobiliário",question:"O que é a enfiteuse (aforamento)?",options:["Tipo de financiamento imobiliário","Direito real em que o proprietário transfere o domínio útil ao enfiteuta, mantendo o domínio direto","Garantia hipotecária especial","Contrato de administração de imóveis"],correct:1,explanation:"A enfiteuse (proibida para novos casos pelo CC/2002) transfere o domínio útil ao enfiteuta, que paga foro anual ao proprietário direto."},
{category:"Direito Trabalhista",question:"O que é a equiparação salarial e quando se aplica no mercado imobiliário?",options:["Todos recebem o mesmo salário","Empregados que exercem mesma função, com mesma produtividade, no mesmo estabelecimento, devem receber igual salário","Equalização de comissões entre corretores","Salário fixado pelo sindicato"],correct:1,explanation:"A equiparação salarial garante salário igual para trabalho de igual valor, mesma função, mesmo empregador e local (art. 461 CLT)."},
{category:"Direito Trabalhista",question:"O que é o adicional de periculosidade e pode ser aplicável na construção civil?",options:["5% sobre o salário base","30% sobre o salário base para trabalhadores expostos a condições perigosas como eletricidade e explosivos","50% sobre horas extras","Não existe na construção civil"],correct:1,explanation:"O adicional de periculosidade é de 30% sobre o salário base para quem trabalha com inflamáveis, explosivos, energia elétrica, etc. (art. 193 CLT)."},
{category:"Direito Previdenciário",question:"O que é o salário-maternidade e a corretora autônoma tem direito?",options:["Apenas empregadas CLT têm direito","Sim, a contribuinte individual tem direito ao salário-maternidade pago pelo INSS","Somente com seguro privado","Apenas para a primeira gravidez"],correct:1,explanation:"A contribuinte individual tem direito ao salário-maternidade pago diretamente pelo INSS, no valor de 1/12 da soma dos últimos 12 salários de contribuição."},
{category:"Direito Previdenciário",question:"O que é a aposentadoria por incapacidade permanente (antiga invalidez)?",options:["Aposentadoria aos 60 anos","Benefício concedido quando o segurado é considerado incapaz total e permanentemente para qualquer trabalho","Aposentadoria especial para corretores","Licença médica de 6 meses"],correct:1,explanation:"A aposentadoria por incapacidade permanente é concedida ao segurado considerado incapaz de forma total e definitiva (art. 42, Lei 8.213/91)."},
{category:"Direito Societário",question:"O que é a cláusula de drag along em um contrato societário?",options:["Direito de arrastar os minoritários na venda — se o majoritário vender, os demais são obrigados a vender nas mesmas condições","Direito de vetar qualquer venda de quotas","Direito de adquirir quotas com desconto","Obrigação de manter as quotas por 10 anos"],correct:0,explanation:"O drag along obriga os sócios minoritários a vender suas quotas junto com o majoritário, nas mesmas condições, facilitando a venda total da empresa."},
{category:"Direito Societário",question:"O que é a cláusula de tag along?",options:["Direito do majoritário de comprar quotas dos minoritários","Direito dos sócios minoritários de vender suas quotas nas mesmas condições oferecidas ao majoritário","Obrigação de manter as quotas por 5 anos","Direito de preferência em aumento de capital"],correct:1,explanation:"O tag along protege os minoritários, garantindo que possam vender suas quotas nas mesmas condições da oferta feita ao sócio majoritário."},
{category:"Direito Tributário",question:"O que é o IPTU verde ou IPTU ecológico?",options:["Imposto sobre imóveis em áreas verdes","Desconto no IPTU concedido por municípios a imóveis que adotam práticas sustentáveis","Imposto sobre resíduos de construção","Taxa ambiental para construtoras"],correct:1,explanation:"O IPTU verde oferece desconto no imposto para imóveis com medidas sustentáveis como energia solar, captação de água da chuva, etc."},
{category:"Direito Tributário",question:"O que é a depreciação de imóveis para fins tributários em holdings?",options:["Desvalorização do imóvel por uso, que gera despesa dedutível reduzindo a base de cálculo do IR","Aumento do valor do imóvel ao longo do tempo","Imposto cobrado sobre imóveis abandonados","Multa por falta de manutenção"],correct:0,explanation:"A depreciação é a perda de valor do imóvel por uso/desgaste, contabilizada como despesa que reduz a base de cálculo dos tributos sobre o lucro (taxa de 4% a.a. para imóveis)."},
{category:"Reforma Tributária",question:"O que é a trava de alíquota prevista na Reforma Tributária?",options:["Limite máximo de 5% para qualquer tributo","Mecanismo que impede a alíquota de referência do IBS/CBS de ultrapassar 26,5%","Congelamento de todos os impostos por 10 anos","Proibição de aumento de IPTU"],correct:1,explanation:"A trava de alíquota é um mecanismo de controle que limita a carga tributária total do IBS+CBS, exigindo revisão de benefícios se ultrapassar o teto."},
{category:"Reforma Tributária",question:"A Reforma Tributária impacta o ganho de capital na venda de imóveis?",options:["Sim, o ganho de capital será substituído pelo IBS","Não, o ganho de capital (IR) continua sendo cobrado separadamente — a reforma trata de tributos sobre o consumo","A reforma isenta todo ganho de capital imobiliário","O ganho de capital passa a ser estadual"],correct:1,explanation:"A reforma trata de tributos sobre consumo (IBS/CBS). O IR sobre ganho de capital permanece inalterado como tributo sobre a renda."},
{category:"Direito Imobiliário",question:"O que é a cédula de crédito imobiliário (CCI)?",options:["Cartão de crédito para compra de imóveis","Título representativo de crédito imobiliário, emitido por credor para negociação no mercado","Certidão do cartório de imóveis","Comprovante de pagamento de parcela"],correct:1,explanation:"A CCI representa créditos imobiliários e pode ser negociada no mercado de capitais, facilitando a securitização (Lei 10.931/2004)."},
{category:"Direito Imobiliário",question:"O que é a LCI (Letra de Crédito Imobiliário)?",options:["Licença para construção de imóveis","Título de renda fixa emitido por bancos, lastreado em créditos imobiliários, isento de IR para PF","Certidão de legalidade do imóvel","Contrato de locação indexado"],correct:1,explanation:"A LCI é um título emitido por instituições financeiras, lastreado em financiamentos imobiliários, com isenção de IR para pessoa física (Lei 10.931/2004)."},
{category:"Direito Imobiliário",question:"O que é a tabela Price e como funciona no financiamento imobiliário?",options:["Tabela de preços de imóveis por região","Sistema de amortização com parcelas fixas, onde no início a maior parte é juros e no final é amortização","Lista de taxas cartorárias","Índice de valorização imobiliária"],correct:1,explanation:"Na tabela Price, as parcelas são constantes. No início, a composição é mais juros e menos amortização, invertendo-se ao longo do tempo."},

];

