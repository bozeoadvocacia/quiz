// -- Do material do usuário --
{category:"Direito Imobiliário",question:"No Direito Imobiliário brasileiro, qual é o ato que efetivamente transfere a propriedade de um imóvel?",options:["Assinatura do contrato de compra e venda","Registro do título no Cartório de Registro de Imóveis","Pagamento integral do preço","Escritura pública lavrada em cartório"],correct:1,explanation:"No Brasil, a propriedade imobiliária só se transfere com o registro do título aquisitivo no Cartório de Registro de Imóveis (art. 1.245 do Código Civil)."},
{category:"Direito Imobiliário",question:"O que é a matrícula do imóvel?",options:["O documento que comprova o pagamento do IPTU","O registro único e individualizado do imóvel no Cartório de Registro de Imóveis","A certidão negativa de ônus reais","O alvará de construção emitido pela prefeitura"],correct:1,explanation:"A matrícula é o registro individual do imóvel, onde consta todo seu histórico de proprietários, ônus e alterações (Lei 6.015/73)."},
{category:"Direito Imobiliário",question:"Qual é o prazo de usucapião extraordinária previsto no Código Civil?",options:["5 anos","10 anos","15 anos","20 anos"],correct:2,explanation:"A usucapião extraordinária exige posse contínua e incontestada por 15 anos, podendo ser reduzida para 10 anos se houver moradia ou obra (art. 1.238 CC)."},
{category:"Direito Imobiliário",question:"No contrato de locação regido pela Lei 8.245/91, qual é o prazo mínimo para o locador solicitar o imóvel na denúncia vazia?",options:["O contrato deve ter prazo igual ou superior a 30 meses","O contrato deve ter prazo de 12 meses","O contrato deve ter prazo de 24 meses","Não existe prazo mínimo para denúncia vazia"],correct:0,explanation:"A denúncia vazia (sem justificativa) só é possível em contratos com prazo igual ou superior a 30 meses, após o término do prazo (art. 46, Lei 8.245/91)."},
{category:"Direito Imobiliário",question:"De acordo com os dados sobre o mercado imobiliário brasileiro, qual é a situação da regularização de imóveis no país?",options:["70% a 80% dos imóveis estão regularizados","Apenas 25% dos imóveis possuem escritura pública","50% dos imóveis no Brasil são regularizados","A regularização atingiu 100% das capitais em 2025"],correct:2,explanation:"Estima-se que cerca de 50% dos imóveis no Brasil possuem algum tipo de irregularidade fundiária."},
{category:"Direito Imobiliário",question:"Qual é o impacto das ações judiciais por vícios construtivos nas disputas do mercado imobiliário?",options:["Representam cerca de 50% das disputas envolvendo construtoras","Correspondem a 70% a 80% das disputas judiciais","Estão em tendência de queda devido a novas regulamentações","Representam apenas 4% a 10% dos casos totais"],correct:1,explanation:"Os vícios construtivos representam a grande maioria (70-80%) das disputas judiciais envolvendo construtoras e incorporadoras."},

// -- Novas perguntas --
{category:"Direito Imobiliário",question:"Qual é o prazo de usucapião ordinária previsto no Código Civil?",options:["5 anos","10 anos","15 anos","20 anos"],correct:1,explanation:"A usucapião ordinária exige posse contínua por 10 anos, com justo título e boa-fé, podendo ser reduzida para 5 anos em situações específicas (art. 1.242 CC)."},
{category:"Direito Imobiliário",question:"O que é a evicção no Direito Imobiliário?",options:["O direito de preferência do inquilino","A perda do imóvel por decisão judicial em favor de terceiro com direito anterior","O registro da escritura pública","A retomada do imóvel pelo locador"],correct:1,explanation:"Evicção ocorre quando o comprador perde o imóvel por sentença judicial que reconhece direito anterior de terceiro (arts. 447 a 457 CC)."},
{category:"Direito Imobiliário",question:"Qual é o prazo prescricional para cobrar vícios construtivos aparentes após a entrega do imóvel?",options:["30 dias","90 dias","1 ano","5 anos"],correct:1,explanation:"O prazo para reclamar vícios aparentes é de 90 dias para bens duráveis, conforme o Código de Defesa do Consumidor (art. 26, II)."},
{category:"Direito Imobiliário",question:"O que é a cláusula de inalienabilidade em um imóvel?",options:["Proibição de alugar o imóvel","Restrição que impede a venda do imóvel por determinado período","Obrigação de reformar o imóvel","Isenção de IPTU"],correct:1,explanation:"A cláusula de inalienabilidade impede a transferência do bem, podendo ser imposta em doações ou testamentos (art. 1.911 CC)."},
{category:"Direito Imobiliário",question:"O que é o direito de superfície?",options:["O direito de usar o subsolo do terreno","O direito de construir ou plantar em terreno alheio","O direito de passagem pelo terreno vizinho","O direito de preferência na compra"],correct:1,explanation:"O direito de superfície permite construir ou plantar em terreno de outrem, por prazo determinado ou indeterminado (arts. 1.369 a 1.377 CC)."},
{category:"Direito Imobiliário",question:"Qual é a garantia legal de solidez e segurança da construção prevista no Código Civil?",options:["1 ano","3 anos","5 anos","10 anos"],correct:2,explanation:"O construtor responde por 5 anos pela solidez e segurança do trabalho de engenharia e dos materiais empregados (art. 618 CC)."},
{category:"Direito Imobiliário",question:"O que é o patrimônio de afetação na incorporação imobiliária?",options:["Penhora dos bens do incorporador","Separação do patrimônio do empreendimento do patrimônio geral do incorporador","Bloqueio judicial de contas bancárias","Hipoteca do terreno"],correct:1,explanation:"O patrimônio de afetação separa os recursos do empreendimento dos demais bens do incorporador, protegendo os compradores (Lei 4.591/64, art. 31-A)."},
{category:"Direito Imobiliário",question:"O que é a escritura pública de compra e venda de imóvel?",options:["O contrato particular entre as partes","O documento lavrado em Tabelionato de Notas que formaliza a transação","O registro no Cartório de Registro de Imóveis","O laudo de avaliação do imóvel"],correct:1,explanation:"A escritura pública é o instrumento lavrado pelo Tabelião de Notas, obrigatório para imóveis acima de 30 salários mínimos (art. 108 CC)."},
{category:"Direito Imobiliário",question:"Para imóveis de qual valor a escritura pública é dispensável, podendo usar instrumento particular?",options:["Acima de 50 salários mínimos","Acima de 100 salários mínimos","Até 30 salários mínimos","Até 10 salários mínimos"],correct:2,explanation:"Para negócios cujo valor não ultrapasse 30 salários mínimos, a lei dispensa a escritura pública (art. 108 CC)."},
{category:"Direito Imobiliário",question:"O que é o direito de preferência (preempção) do inquilino?",options:["O direito de renovar o contrato automaticamente","O direito de ser o primeiro a comprar o imóvel em caso de venda, em igualdade de condições","O direito de sublocar o imóvel","O direito de reduzir o valor do aluguel"],correct:1,explanation:"O inquilino tem preferência para adquirir o imóvel locado em igualdade de condições com terceiros (art. 27, Lei 8.245/91)."},
{category:"Direito Imobiliário",question:"O que é o compromisso de compra e venda irretratável?",options:["Um contrato que pode ser desfeito a qualquer momento","Um contrato preliminar que obriga as partes a celebrar o contrato definitivo","Uma escritura pública de doação","Um contrato de locação de longo prazo"],correct:1,explanation:"O compromisso irretratável é um contrato preliminar que, registrado, confere direito real ao compromissário comprador (art. 1.417 CC)."},
{category:"Direito Imobiliário",question:"Qual é a principal lei que regulamenta os condomínios edilícios no Brasil?",options:["Código Civil (arts. 1.331 a 1.358)","Lei 4.591/64 apenas","Código de Processo Civil","Lei 8.245/91"],correct:0,explanation:"O Código Civil de 2002 passou a regulamentar os condomínios edilícios nos arts. 1.331 a 1.358, sendo complementado pela Lei 4.591/64."},
{category:"Direito Imobiliário",question:"O que são as arras confirmatórias no contrato imobiliário?",options:["Um tipo de garantia hipotecária","Sinal dado como confirmação do negócio e início de pagamento","Multa por rescisão contratual","Taxa de corretagem"],correct:1,explanation:"Arras confirmatórias funcionam como sinal e princípio de pagamento, confirmando a vontade das partes (art. 418 CC)."},
{category:"Direito Imobiliário",question:"O que é a ação de adjudicação compulsória?",options:["Ação para despejar inquilino","Ação para obter registro do imóvel quando o vendedor se recusa a outorgar escritura","Ação de cobrança de condomínio","Ação de usucapião"],correct:1,explanation:"A adjudicação compulsória permite ao comprador obter judicialmente a transferência do imóvel quando o vendedor descumpre a obrigação."},
{category:"Direito Imobiliário",question:"Qual é o conceito de bem de família legal?",options:["Imóvel rural de até 4 módulos fiscais","O imóvel residencial próprio do casal ou entidade familiar, impenhorável por dívidas","Imóvel doado em testamento","Imóvel registrado em nome de menor"],correct:1,explanation:"O bem de família legal é o imóvel residencial próprio, protegido contra penhora por dívidas (Lei 8.009/90)."},
{category:"Direito Imobiliário",question:"Em qual situação o bem de família pode ser penhorado?",options:["Dívida de cartão de crédito","Financiamento do próprio imóvel","Dívida trabalhista de empregado doméstico apenas","Todas as dívidas acima de 100 salários mínimos"],correct:1,explanation:"O bem de família pode ser penhorado por dívida de financiamento para aquisição do próprio imóvel, entre outras exceções legais (art. 3º, Lei 8.009/90)."},
{category:"Direito Imobiliário",question:"O que é a retificação de registro imobiliário?",options:["A mudança de endereço do cartório","A correção de dados incorretos na matrícula do imóvel","A transferência de propriedade","A averbação de construção"],correct:1,explanation:"A retificação corrige erros ou omissões no registro imobiliário, podendo ser administrativa ou judicial (art. 213, Lei 6.015/73)."},
{category:"Direito Imobiliário",question:"O que é o memorial de incorporação?",options:["A planta baixa do imóvel","O conjunto de documentos que o incorporador deve registrar antes de vender unidades na planta","O contrato de construção","O laudo de avaliação do terreno"],correct:1,explanation:"O memorial de incorporação é o conjunto de documentos registrados no CRI antes de iniciar a venda de unidades autônomas (art. 32, Lei 4.591/64)."},
{category:"Direito Imobiliário",question:"O que é servidão de passagem?",options:["Obrigação de construir muro divisório","Direito real sobre imóvel alheio que impõe ao prédio serviente um ônus em benefício do prédio dominante","Direito de construir em terreno vizinho","Obrigação de plantar árvores na divisa"],correct:1,explanation:"A servidão é um direito real que onera um prédio (serviente) em favor de outro (dominante), como passagem de pessoas ou tubulações (arts. 1.378 a 1.389 CC)."},
{category:"Direito Imobiliário",question:"Qual é o prazo decadencial para o condomínio cobrar cotas condominiais em atraso?",options:["2 anos","5 anos","10 anos","Não há prazo decadencial, há prazo prescricional de 5 anos"],correct:3,explanation:"A cobrança de cotas condominiais tem prazo prescricional de 5 anos (art. 206, §5º, I, CC), não decadencial."},
{category:"Direito Imobiliário",question:"O que é a averbação no registro de imóveis?",options:["O primeiro registro de propriedade","A anotação de alterações ocorridas no imóvel ou nos titulares de direitos","A emissão da matrícula do imóvel","O cancelamento do registro"],correct:1,explanation:"Averbação é a anotação de fatos que alteram o registro, como construção, casamento, penhora, entre outros (art. 167, II, Lei 6.015/73)."},
{category:"Direito Imobiliário",question:"O que é a cláusula de reversão em doação de imóvel?",options:["O donatário devolve o imóvel ao doar para terceiro","Se o donatário falecer antes do doador, o bem retorna ao doador","O doador pode revogar a doação a qualquer momento","O imóvel é automaticamente vendido após 10 anos"],correct:1,explanation:"A cláusula de reversão determina que, se o donatário falecer antes do doador, o bem retorna ao patrimônio do doador (art. 547 CC)."},
{category:"Direito Imobiliário",question:"Qual é a multa máxima por atraso no pagamento de condomínio prevista no Código Civil?",options:["5%","10%","2%","20%"],correct:2,explanation:"A multa moratória para cotas condominiais não pode exceder 2% sobre o débito (art. 1.336, §1º, CC)."},
{category:"Direito Imobiliário",question:"O que é a usucapião especial urbana (constitucional)?",options:["Posse de 15 anos em imóvel urbano","Posse de 5 anos em área urbana de até 250m², sem ser proprietário de outro imóvel","Posse de 10 anos em imóvel comercial","Posse de 2 anos em imóvel abandonado"],correct:1,explanation:"A usucapião especial urbana exige posse de 5 anos em área de até 250m², para moradia, sem outro imóvel (art. 183, CF e art. 1.240 CC)."},
{category:"Direito Imobiliário",question:"O que é o distrato de incorporação imobiliária conforme a Lei 13.786/2018?",options:["A rescisão contratual com restituição integral imediata","A resolução do contrato com retenção de até 50% dos valores pagos pela incorporadora","A anulação judicial do contrato","A transferência do contrato a terceiro"],correct:1,explanation:"A Lei do Distrato permite retenção de até 50% (com patrimônio de afetação) ou 25% (sem) dos valores pagos pelo adquirente que desistir."},
{category:"Direito Imobiliário",question:"O que é o direito real de laje?",options:["O direito de usar a laje para antena de celular","O direito de construir sobre ou sob construção alheia, como unidade autônoma","O direito de impermeabilizar a laje do vizinho","O direito de acessar o telhado do condomínio"],correct:1,explanation:"O direito real de laje permite ao titular manter unidade distinta da construção-base, com matrícula própria (art. 1.510-A CC)."},
{category:"Direito Imobiliário",question:"O que é a hipoteca?",options:["A venda forçada do imóvel","Direito real de garantia que grava o imóvel sem transferir a posse ao credor","A transferência definitiva da propriedade ao banco","O aluguel do imóvel ao credor"],correct:1,explanation:"A hipoteca é direito real de garantia sobre imóvel, sem transferência de posse ou propriedade ao credor (arts. 1.473 a 1.505 CC)."},
{category:"Direito Imobiliário",question:"Qual a diferença entre hipoteca e alienação fiduciária de imóvel?",options:["Não há diferença prática","Na alienação fiduciária, a propriedade é transferida ao credor até a quitação; na hipoteca, o imóvel permanece com o devedor","Na hipoteca, o imóvel fica com o banco; na alienação fiduciária, com o devedor","A hipoteca é mais rápida na execução"],correct:1,explanation:"Na alienação fiduciária, o credor detém a propriedade resolúvel até a quitação. Na hipoteca, o devedor mantém a propriedade plena, com ônus registrado."},
{category:"Direito Imobiliário",question:"Qual é a função da certidão de ônus reais?",options:["Comprovar o pagamento de IPTU","Informar se existem gravames, penhoras ou ônus sobre o imóvel","Confirmar a metragem do terreno","Autorizar a construção no terreno"],correct:1,explanation:"A certidão de ônus reais revela se há hipotecas, penhoras, arrestos ou outros gravames registrados na matrícula do imóvel."},
{category:"Direito Imobiliário",question:"O que é a multipropriedade imobiliária (time-sharing)?",options:["Propriedade de múltiplos imóveis por uma pessoa","Regime em que cada titular tem o direito de uso exclusivo do imóvel por período determinado do ano","Condomínio com mais de 100 unidades","Propriedade compartilhada entre cônjuges"],correct:1,explanation:"A multipropriedade é o regime de condomínio em que cada titular usa o imóvel por fração temporal definida (arts. 1.358-B a 1.358-U CC, Lei 13.777/2018)."},
{category:"Direito Imobiliário",question:"Qual é o prazo máximo de vigência do contrato de locação não residencial para fins de renovatória?",options:["5 anos","10 anos","Não há limite","30 anos"],correct:0,explanation:"O contrato deve ter prazo mínimo de 5 anos (somados os prazos ininterruptos) para a ação renovatória de locação comercial (art. 51, Lei 8.245/91)."},
{category:"Direito Imobiliário",question:"Em caso de venda do imóvel locado, o que acontece com o contrato de locação?",options:["O contrato é automaticamente rescindido","O novo proprietário deve respeitar o contrato se houver cláusula de vigência averbada na matrícula","O inquilino deve sair imediatamente","O contrato é renovado automaticamente por mais 30 meses"],correct:1,explanation:"A cláusula de vigência averbada na matrícula obriga o adquirente a respeitar a locação durante o prazo contratual (art. 8º, Lei 8.245/91)."},

