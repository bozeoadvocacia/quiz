// -- Do material do usuário --
{category:"Reforma Tributária",question:"Com a entrada em vigor da CBS, qual poderá ser um dos principais impactos para quem aufere renda com aluguel de imóveis?",options:["O aluguel passará a ser isento de qualquer tributação federal","Dependendo do enquadramento, a receita de aluguel poderá sofrer incidência da CBS","Apenas imóveis comerciais estarão sujeitos à CBS","A CBS substituirá exclusivamente o IPTU"],correct:1,explanation:"A CBS poderá incidir sobre receitas de aluguel dependendo do enquadramento do contribuinte e da forma de exploração do imóvel."},
{category:"Reforma Tributária",question:"O Cadastro Imobiliário Brasileiro (CIB), o 'CPF do imóvel', tem como principal finalidade:",options:["Substituir o registro no Cartório de Registro de Imóveis","Servir como documento obrigatório para compra e venda","Criar identificação única para imóveis, facilitando gestão cadastral pelos órgãos públicos","Determinar automaticamente o valor venal para cobrança de IPTU"],correct:2,explanation:"O CIB cria uma identificação numérica única para cada imóvel, integrando cadastros públicos e facilitando a gestão tributária e fundiária."},

// -- Novas perguntas --
{category:"Reforma Tributária",question:"A Reforma Tributária (EC 132/2023) substitui quais tributos pelo IBS e CBS?",options:["IRPJ e CSLL","ICMS, ISS, PIS, COFINS e IPI","Apenas o IPTU e ITBI","ITCMD e ITR"],correct:1,explanation:"O IBS substitui ICMS e ISS, e a CBS substitui PIS, COFINS e IPI, unificando a tributação sobre o consumo."},
{category:"Reforma Tributária",question:"Qual é o redutor de alíquota aplicável às operações imobiliárias na Reforma Tributária?",options:["20%","40%","50%","60%"],correct:1,explanation:"As operações com bens imóveis terão redução de 40% nas alíquotas de IBS e CBS, conforme a Lei Complementar da Reforma."},
{category:"Reforma Tributária",question:"O que é o 'redutor de ajuste' nas operações imobiliárias da Reforma Tributária?",options:["Desconto no valor do ITBI","Mecanismo que reduz a base de cálculo do IBS/CBS para evitar cumulatividade em imóveis adquiridos antes da reforma","Redução automática do IPTU","Desconto no registro do imóvel"],correct:1,explanation:"O redutor de ajuste deduz da base de cálculo o custo de aquisição do imóvel (quando adquirido antes da reforma e sem crédito), evitando tributação em cascata."},
{category:"Reforma Tributária",question:"O que é o 'redutor social' para operações imobiliárias na Reforma Tributária?",options:["Isenção para imóveis de luxo","Desconto fixo na base de cálculo para imóveis residenciais novos e locação, beneficiando habitação popular","Redução do IPTU para aposentados","Subsídio do governo para construtoras"],correct:1,explanation:"O redutor social é um valor fixo deduzido da base de cálculo das operações imobiliárias, beneficiando especialmente habitação de menor valor."},
{category:"Reforma Tributária",question:"Durante o período de transição da Reforma Tributária, quando a CBS começa a ser cobrada?",options:["2025","2026","2027","2029"],correct:1,explanation:"A CBS começa a ser cobrada em 2026 com alíquota-teste de 0,9%, passando à alíquota integral em 2027."},
{category:"Reforma Tributária",question:"Em qual ano o IBS começa a ser cobrado na transição da Reforma Tributária?",options:["2026","2027","2029","2033"],correct:2,explanation:"O IBS entra em vigor gradualmente a partir de 2029, com elevação progressiva das alíquotas até 2033, quando ICMS e ISS são extintos."},
{category:"Reforma Tributária",question:"O que é o split payment na Reforma Tributária e como afeta transações imobiliárias?",options:["Parcelamento do imposto em 12 vezes","Sistema em que o pagamento do tributo é separado automaticamente no momento da transação financeira","Divisão do ITBI entre comprador e vendedor","Pagamento antecipado de 50% do imposto"],correct:1,explanation:"O split payment separa automaticamente o valor do IBS/CBS no momento do pagamento, repassando-o diretamente ao fisco."},
{category:"Reforma Tributária",question:"A locação de imóveis por pessoa física será tributada pelo IBS/CBS na Reforma Tributária?",options:["Sim, toda locação será tributada","Não, a locação por pessoa física com até 3 imóveis (ou receita dentro do limite) é considerada não-contribuinte","Apenas imóveis acima de R$ 5 mil de aluguel","Somente se o locador tiver CNPJ"],correct:1,explanation:"Pessoa física que aluga até 3 imóveis (ou receita bruta anual dentro do limite legal) não é considerada contribuinte do IBS/CBS sobre aluguéis."},
{category:"Reforma Tributária",question:"Como a Reforma Tributária impacta as holdings patrimoniais que administram imóveis para locação?",options:["Holdings ficam isentas de todos os tributos","Holdings serão contribuintes do IBS/CBS sobre aluguéis, mas com redutor de 40% na alíquota","Holdings serão extintas por lei","Não há nenhum impacto"],correct:1,explanation:"Holdings que locam imóveis serão contribuintes do IBS/CBS, porém com alíquota reduzida em 40% e possibilidade de créditos."},
{category:"Reforma Tributária",question:"O que acontece com o PIS e COFINS sobre aluguéis após a implementação total da Reforma Tributária?",options:["Continuam existindo normalmente","São substituídos pela CBS","São reduzidos pela metade","São incorporados ao IRPJ"],correct:1,explanation:"PIS e COFINS serão completamente substituídos pela CBS a partir da implementação integral da reforma."},
{category:"Reforma Tributária",question:"A Reforma Tributária alterou as regras do ITCMD. Qual é a principal mudança?",options:["O ITCMD foi extinto","O ITCMD passará a ter alíquotas progressivas obrigatoriamente","A alíquota máxima foi reduzida para 2%","O ITCMD passou a ser competência federal"],correct:1,explanation:"A EC 132/2023 determinou que o ITCMD tenha alíquotas progressivas, ou seja, quanto maior o valor da herança/doação, maior a alíquota."},
{category:"Reforma Tributária",question:"Qual é a alíquota de referência estimada do IBS + CBS somados?",options:["15%","20%","26,5%","35%"],correct:2,explanation:"A alíquota de referência estimada é de aproximadamente 26,5% (IBS + CBS somados), mas com redutores específicos para cada setor."},
{category:"Reforma Tributária",question:"Na Reforma Tributária, qual é a alíquota efetiva estimada para operações imobiliárias após o redutor de 40%?",options:["Aproximadamente 26,5%","Aproximadamente 15,9%","Aproximadamente 10%","Aproximadamente 5%"],correct:1,explanation:"Com o redutor de 40% sobre a alíquota de referência (~26,5%), a alíquota efetiva para operações imobiliárias ficaria em torno de 15,9%."},
{category:"Reforma Tributária",question:"A venda de imóvel por pessoa física será tributada pelo IBS/CBS?",options:["Sim, todas as vendas","Não, pessoa física que vende imóvel próprio não é considerada contribuinte habitual","Apenas acima de R$ 500 mil","Somente na segunda venda em 12 meses"],correct:1,explanation:"A venda esporádica de imóvel por pessoa física não caracteriza habitualidade, logo não incide IBS/CBS — incide apenas o ganho de capital (IR)."},
{category:"Reforma Tributária",question:"Como funciona o sistema de créditos do IBS/CBS para incorporadoras?",options:["Não há direito a crédito","A incorporadora pode se creditar do IBS/CBS pago em insumos (materiais, serviços) para abater do tributo devido","O crédito é limitado a 10% do valor da obra","Apenas créditos de ICMS são aproveitáveis"],correct:1,explanation:"O IBS/CBS são não-cumulativos: a incorporadora aproveita créditos dos tributos pagos em insumos, reduzindo o valor a pagar na venda das unidades."},
{category:"Reforma Tributária",question:"O que é o princípio do destino adotado pela Reforma Tributária e como afeta o mercado imobiliário?",options:["O imposto é recolhido no local de produção","O IBS é devido ao município/estado onde o imóvel está localizado (destino da operação)","O imposto vai para o município sede da construtora","O princípio do destino só se aplica a exportações"],correct:1,explanation:"O IBS será cobrado no local do consumo/destino — para imóveis, no município onde o bem está localizado, redistribuindo receitas."},
{category:"Reforma Tributária",question:"A Reforma Tributária prevê tratamento diferenciado para habitação de interesse social?",options:["Não, todas as habitações são tratadas igualmente","Sim, com redutores sociais maiores e possível alíquota zero para programas habitacionais","Apenas isenção de IPTU","Somente financiamento a juros zero"],correct:1,explanation:"A reforma prevê redutores sociais amplificados e possibilidade de alíquota zero para operações do programa Minha Casa Minha Vida e similares."},
{category:"Reforma Tributária",question:"Qual é o papel do Comitê Gestor do IBS na Reforma Tributária?",options:["Fiscalizar obras de construção civil","Administrar a arrecadação e distribuição do IBS entre estados e municípios","Definir o valor venal dos imóveis","Aprovar projetos de incorporação"],correct:1,explanation:"O Comitê Gestor é o órgão intergovernamental responsável por administrar o IBS, definir normas, arrecadar e distribuir os recursos."},
{category:"Reforma Tributária",question:"A Reforma Tributária impacta o Simples Nacional para imobiliárias?",options:["O Simples Nacional foi extinto","Empresas no Simples continuam com regime próprio, mas podem optar por IBS/CBS em operações imobiliárias","Todas as imobiliárias saem do Simples obrigatoriamente","O Simples passa a cobrar alíquota única de 4%"],correct:1,explanation:"O Simples Nacional é mantido, mas contribuintes podem optar pelo regime geral de IBS/CBS quando mais vantajoso em operações imobiliárias."},
{category:"Reforma Tributária",question:"Qual é o impacto da Reforma Tributária nos FIIs (Fundos de Investimento Imobiliário)?",options:["FIIs ficam isentos de todos os tributos","FIIs podem ser contribuintes do IBS/CBS quando auferem receitas de aluguel","FIIs são extintos pela reforma","Apenas FIIs de papel são afetados"],correct:1,explanation:"FIIs que exploram imóveis (aluguel) podem ser contribuintes do IBS/CBS sobre essas receitas, com o redutor de 40%."},
{category:"Reforma Tributária",question:"A Reforma Tributária altera o ITBI municipal?",options:["Sim, o ITBI é extinto e incorporado ao IBS","Não, o ITBI permanece como tributo municipal independente","O ITBI é transferido para a competência estadual","O ITBI passa a ter alíquota nacional única de 2%"],correct:1,explanation:"O ITBI não é afetado diretamente pela reforma — continua como imposto municipal sobre transmissão onerosa de imóveis (art. 156, II, CF)."},
{category:"Reforma Tributária",question:"Na transição da Reforma, quando ICMS e ISS serão completamente extintos?",options:["2027","2029","2033","2035"],correct:2,explanation:"ICMS e ISS serão gradualmente substituídos pelo IBS entre 2029 e 2032, sendo completamente extintos em 2033."},
{category:"Reforma Tributária",question:"O que muda para o corretor de imóveis pessoa física com a Reforma Tributária?",options:["Passa a pagar IBS/CBS sobre todas as comissões","Quem exerce atividade habitual e aufere receita acima do limite pode ser contribuinte do IBS/CBS","Fica isento de todos os tributos","Deve se tornar pessoa jurídica obrigatoriamente"],correct:1,explanation:"Corretores PF que atuam com habitualidade e ultrapassam o limite de receita poderão ser contribuintes do IBS/CBS sobre suas comissões."},

