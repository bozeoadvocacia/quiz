<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz Imobiliário</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --red:#e74c3c; --blue:#3498db; --yellow:#f1c40f; --green:#2ecc71;
  --purple:#8e44ad; --dark:#1a1a2e; --darker:#16213e;
  --card:#1e2a4a; --text:#fff; --text-muted:#b0b8c8;
}
html, body { height:100%; width:100%; font-family:'Segoe UI',system-ui,sans-serif; background:var(--dark); color:var(--text); overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }

.screen { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
.screen.active { display:flex; }

/* JOIN */
#join-screen { background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460); }
.logo { font-size:2.2rem; font-weight:900; margin-bottom:8px; text-align:center; }
.logo span { color:var(--yellow); }
.subtitle { color:var(--text-muted); margin-bottom:36px; font-size:1rem; text-align:center; }
.input-group { width:100%; max-width:340px; margin-bottom:16px; }
.input-group input { width:100%; padding:16px 20px; border:2px solid rgba(255,255,255,.1); border-radius:14px; background:var(--card); color:var(--text); font-size:1.1rem; outline:none; transition:border .2s; text-align:center; letter-spacing:2px; }
.input-group input::placeholder { color:var(--text-muted); letter-spacing:0; }
.input-group input:focus { border-color:var(--blue); }
#name-input { letter-spacing:0; }
.btn-join { width:100%; max-width:340px; padding:16px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font-size:1.2rem; font-weight:700; cursor:pointer; transition:transform .15s; box-shadow:0 6px 20px rgba(52,152,219,.3); }
.btn-join:active { transform:scale(.96); }
.btn-join:disabled { opacity:.5; }
.error-msg { color:var(--red); margin-top:12px; font-size:.9rem; text-align:center; min-height:20px; }

/* LOBBY */
#lobby-screen { background:linear-gradient(135deg,var(--darker),var(--dark)); }
.lobby-icon { font-size:4rem; margin-bottom:16px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.lobby-name { font-size:1.6rem; font-weight:700; margin-bottom:8px; }
.lobby-msg { color:var(--text-muted); font-size:1.1rem; text-align:center; }

/* COUNTDOWN */
#countdown-screen { background:var(--dark); }
.countdown-number { font-size:8rem; font-weight:900; background:linear-gradient(135deg,var(--yellow),var(--red)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:countPulse 1s infinite; }
@keyframes countPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:.8} }

/* QUESTION */
#question-screen { background:var(--dark); padding:16px; justify-content:flex-start; }
.q-header { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 4px; }
.q-counter { font-size:.9rem; color:var(--text-muted); font-weight:600; }
.q-timer { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:900; border:3px solid var(--green); transition:border-color .3s,color .3s; }
.q-timer.warning { border-color:var(--yellow); color:var(--yellow); }
.q-timer.danger { border-color:var(--red); color:var(--red); animation:pulse .5s infinite; }
.q-category { background:var(--purple); color:#fff; padding:4px 14px; border-radius:20px; font-size:.8rem; font-weight:600; display:inline-block; margin-bottom:10px; }
.q-category:empty { display:none; }
.q-text { width:100%; padding:20px; background:var(--card); border-radius:16px; font-size:1.1rem; font-weight:600; text-align:center; line-height:1.5; margin-bottom:20px; min-height:80px; display:flex; align-items:center; justify-content:center; }
.answers-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; flex:1; }
.answer-btn { border:none; border-radius:14px; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px 12px; min-height:80px; transition:transform .12s,filter .2s; position:relative; line-height:1.3; }
.answer-btn:active { transform:scale(.94); }
.answer-btn.disabled { pointer-events:none; opacity:.4; }
.answer-btn.selected { opacity:1!important; transform:scale(1.03); box-shadow:0 0 0 4px #fff; }
.answer-btn:nth-child(1){background:var(--red)} .answer-btn:nth-child(2){background:var(--blue)} .answer-btn:nth-child(3){background:var(--yellow);color:#333} .answer-btn:nth-child(4){background:var(--green)}
.answer-shape { position:absolute; top:8px; left:10px; font-size:1.2rem; opacity:.6; }

/* RESULT */
#result-screen { background:var(--dark); }
.result-icon { font-size:5rem; margin-bottom:16px; }
.result-text { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
.result-points { font-size:1.2rem; color:var(--text-muted); margin-bottom:4px; }
.result-streak { font-size:1rem; color:var(--yellow); margin-bottom:24px; min-height:24px; }
.result-score { font-size:1rem; color:var(--text-muted); }
.result-score strong { color:var(--text); font-size:1.4rem; }

/* WAITING */
#waiting-screen { background:var(--dark); }
.waiting-icon { font-size:3rem; margin-bottom:16px; animation:pulse 2s infinite; }
.waiting-text { color:var(--text-muted); font-size:1.1rem; text-align:center; }

/* FINAL */
#final-screen { background:linear-gradient(135deg,#1a1a2e,#0f3460); }
.final-trophy { font-size:5rem; margin-bottom:16px; }
.final-title { font-size:2rem; font-weight:900; margin-bottom:24px; }
.final-rank { background:var(--card); padding:20px 32px; border-radius:16px; text-align:center; margin-bottom:16px; width:100%; max-width:340px; }
.final-rank .rank-pos { font-size:3rem; font-weight:900; }
.final-rank .rank-label { color:var(--text-muted); font-size:.9rem; margin-bottom:4px; }
.final-rank .rank-score { font-size:1.4rem; font-weight:700; color:var(--yellow); }
.final-leaderboard { width:100%; max-width:340px; margin-top:8px; }
.final-lb-item { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--card); border-radius:10px; margin-bottom:8px; font-weight:600; }
.final-lb-item.me { background:rgba(52,152,219,.2); border:1px solid var(--blue); }
.final-lb-item .lb-rank { width:32px; } .final-lb-item .lb-name { flex:1; } .final-lb-item .lb-score { color:var(--yellow); }

/* DISCONNECTED */
.dc-banner { position:fixed; top:0; left:0; right:0; background:var(--red); color:#fff; text-align:center; padding:10px; font-weight:700; font-size:.9rem; z-index:999; display:none; }
.dc-banner.show { display:block; }
</style>
</head>
<body>

<div class="dc-banner" id="dc-banner">Conexão perdida. Tentando reconectar...</div>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="logo">🏠 Quiz <span>Imobiliário</span></div>
  <div class="subtitle">Teste seus conhecimentos sobre o mercado!</div>
  <div class="input-group">
    <input type="text" id="code-input" placeholder="Código do jogo" maxlength="6" inputmode="numeric">
  </div>
  <div class="input-group">
    <input type="text" id="name-input" placeholder="Seu nome" maxlength="20">
  </div>
  <button class="btn-join" id="btn-join">Entrar</button>
  <div class="error-msg" id="join-error"></div>
</div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen">
  <div class="lobby-icon">✅</div>
  <div class="lobby-name" id="lobby-name"></div>
  <div class="lobby-msg">Você está dentro! Aguarde o host iniciar o jogo...</div>
</div>

<!-- COUNTDOWN -->
<div id="countdown-screen" class="screen">
  <div class="countdown-number" id="countdown-num">3</div>
</div>

<!-- QUESTION -->
<div id="question-screen" class="screen">
  <div class="q-header">
    <div class="q-counter" id="q-counter"></div>
    <div class="q-timer" id="q-timer">20</div>
  </div>
  <div id="q-category" class="q-category"></div>
  <div class="q-text" id="q-text"></div>
  <div class="answers-grid" id="answers-grid"></div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-text" id="result-text"></div>
  <div class="result-points" id="result-points"></div>
  <div class="result-streak" id="result-streak"></div>
  <div class="result-score">Pontuação total: <strong id="result-total">0</strong></div>
</div>

<!-- WAITING (between results and next question) -->
<div id="waiting-screen" class="screen">
  <div class="waiting-icon">⏳</div>
  <div class="waiting-text">Aguardando próxima pergunta...</div>
</div>

<!-- FINAL -->
<div id="final-screen" class="screen">
  <div class="final-trophy">🏆</div>
  <div class="final-title">Fim do Quiz!</div>
  <div class="final-rank" id="final-rank">
    <div class="rank-label">Sua posição</div>
    <div class="rank-pos" id="final-pos">-</div>
    <div class="rank-score" id="final-score">0 pontos</div>
  </div>
  <div class="final-leaderboard" id="final-leaderboard"></div>
</div>

<script>
let peer = null;
let conn = null;
let gameCode = '';
let playerName = '';
let timerInterval = null;
const shapes = ['▲','◆','●','■'];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── JOIN ───
document.getElementById('btn-join').addEventListener('click', joinGame);
document.getElementById('code-input').addEventListener('keyup', e => { if(e.key==='Enter') document.getElementById('name-input').focus(); });
document.getElementById('name-input').addEventListener('keyup', e => { if(e.key==='Enter') joinGame(); });

function joinGame() {
  const code = document.getElementById('code-input').value.trim();
  const name = document.getElementById('name-input').value.trim();
  const errEl = document.getElementById('join-error');
  errEl.textContent = '';

  if (!code || code.length < 6) { errEl.textContent = 'Digite o código de 6 dígitos.'; return; }
  if (!name) { errEl.textContent = 'Digite seu nome.'; return; }

  const btn = document.getElementById('btn-join');
  btn.disabled = true;
  btn.textContent = 'Conectando...';
  gameCode = code;
  playerName = name;

  peer = new Peer(undefined, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]}
  });

  peer.on('open', () => {
    const hostPeerId = 'quizimob-' + code;
    conn = peer.connect(hostPeerId, { reliable: true });

    const timeout = setTimeout(() => {
      errEl.textContent = 'Não foi possível conectar. Verifique o código.';
      btn.disabled = false; btn.textContent = 'Entrar';
      try { conn.close(); } catch(e) {}
    }, 10000);

    conn.on('open', () => {
      clearTimeout(timeout);
      conn.send({ type: 'join', name });
    });

    conn.on('data', (msg) => handleHostMessage(msg, errEl, btn));

    conn.on('close', () => {
      document.getElementById('dc-banner').classList.add('show');
    });

    conn.on('error', () => {
      clearTimeout(timeout);
      errEl.textContent = 'Erro de conexão. Tente novamente.';
      btn.disabled = false; btn.textContent = 'Entrar';
    });
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    errEl.textContent = 'Erro de conexão. Verifique sua internet.';
    btn.disabled = false; btn.textContent = 'Entrar';
  });
}

// ─── MESSAGE HANDLING ───
function handleHostMessage(msg, errEl, btn) {
  switch(msg.type) {
    case 'error':
      if (errEl) errEl.textContent = msg.message;
      if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
      break;

    case 'joined':
      document.getElementById('lobby-name').textContent = msg.name;
      showScreen('lobby-screen');
      break;

    case 'game-starting':
      showScreen('countdown-screen');
      let count = 3;
      document.getElementById('countdown-num').textContent = count;
      const ci = setInterval(() => { count--; if(count<=0){clearInterval(ci);return;} document.getElementById('countdown-num').textContent=count; }, 1000);
      break;

    case 'new-question':
      showQuestion(msg);
      break;

    case 'answer-result':
      document.getElementById('result-icon').textContent = msg.isCorrect ? '🎉' : '😢';
      document.getElementById('result-text').textContent = msg.isCorrect ? 'Correto!' : 'Errado!';
      document.getElementById('result-points').textContent = msg.isCorrect ? `+${msg.points} pontos` : 'Nenhum ponto';
      document.getElementById('result-streak').textContent = msg.streak >= 2 ? `🔥 ${msg.streak} acertos seguidos!` : '';
      document.getElementById('result-total').textContent = msg.totalScore;
      showScreen('result-screen');
      break;

    case 'question-results':
      // Player moves to waiting screen
      showScreen('waiting-screen');
      break;

    case 'game-over':
      showFinal(msg.leaderboard);
      break;
  }
}

function showQuestion(data) {
  showScreen('question-screen');
  document.getElementById('q-counter').textContent = `${data.index+1} / ${data.total}`;
  document.getElementById('q-category').textContent = data.category || '';
  document.getElementById('q-text').textContent = data.question;

  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';
  data.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="answer-shape">${shapes[i]}</span>${opt}`;
    btn.addEventListener('click', () => submitAnswer(i));
    grid.appendChild(btn);
  });

  let timeLeft = data.duration;
  const timerEl = document.getElementById('q-timer');
  timerEl.textContent = timeLeft; timerEl.className = 'q-timer';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = Math.max(0, timeLeft);
    if (timeLeft <= 5) timerEl.className = 'q-timer danger';
    else if (timeLeft <= 10) timerEl.className = 'q-timer warning';
    if (timeLeft <= 0) clearInterval(timerInterval);
  }, 1000);
}

function submitAnswer(index) {
  clearInterval(timerInterval);
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((b, i) => { if(i===index)b.classList.add('selected'); else b.classList.add('disabled'); });
  conn.send({ type:'answer', answer:index });
}

function showFinal(leaderboard) {
  showScreen('final-screen');
  const myRank = leaderboard.find(p => p.name === playerName);
  if (myRank) {
    document.getElementById('final-pos').textContent = `${myRank.rank}º`;
    document.getElementById('final-score').textContent = `${myRank.score} pontos`;
  }
  const lb = document.getElementById('final-leaderboard');
  lb.innerHTML = '';
  leaderboard.slice(0, 5).forEach(p => {
    const div = document.createElement('div');
    div.className = 'final-lb-item' + (p.name === playerName ? ' me' : '');
    div.innerHTML = `<span class="lb-rank">${p.rank}º</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.score}</span>`;
    lb.appendChild(div);
  });
}
</script>
</body>
</html>
