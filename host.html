<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Imobiliário — Host</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #e74c3c; --blue: #3498db; --yellow: #f1c40f; --green: #2ecc71;
  --purple: #8e44ad; --dark: #1a1a2e; --darker: #16213e;
  --card: #1e2a4a; --text: #fff; --text-muted: #b0b8c8;
}
html, body { height:100%; width:100%; font-family:'Segoe UI',system-ui,sans-serif; background:var(--dark); color:var(--text); overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }

.screen { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
.screen.active { display:flex; }

/* ── LOBBY ── */
#lobby-screen { background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460); }
.lobby-logo { font-size:3rem; font-weight:900; margin-bottom:4px; }
.lobby-logo span { color:var(--yellow); }
.lobby-sub { color:var(--text-muted); font-size:1.1rem; margin-bottom:32px; }
.code-display { background:var(--card); border-radius:20px; padding:28px 56px; text-align:center; margin-bottom:32px; border:2px solid rgba(255,255,255,.08); }
.code-label { color:var(--text-muted); font-size:1rem; margin-bottom:8px; text-transform:uppercase; letter-spacing:2px; }
.code-value { font-size:5rem; font-weight:900; letter-spacing:12px; color:var(--yellow); }
.code-url { color:var(--text-muted); font-size:.95rem; margin-top:10px; word-break:break-all; }
.players-section { text-align:center; margin-bottom:32px; width:100%; max-width:700px; }
.players-count { font-size:1.2rem; color:var(--text-muted); margin-bottom:16px; }
.players-list { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-height:180px; overflow-y:auto; }
.player-chip { background:var(--card); padding:10px 20px; border-radius:30px; font-weight:600; font-size:1rem; animation:chipIn .3s ease-out; border:1px solid rgba(255,255,255,.06); }
@keyframes chipIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.btn-start { padding:18px 56px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--green),#27ae60); color:#fff; font-size:1.4rem; font-weight:800; cursor:pointer; box-shadow:0 8px 24px rgba(46,204,113,.3); transition:transform .15s; }
.btn-start:hover { transform:scale(1.04); }
.btn-start:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.status-dot.connecting { background:var(--yellow); animation:pulse 1s infinite; }
.status-dot.ready { background:var(--green); }
.status-dot.error { background:var(--red); }
.conn-status { font-size:.9rem; color:var(--text-muted); margin-bottom:16px; }

/* ── COUNTDOWN ── */
#countdown-screen { background:var(--dark); }
.big-countdown { font-size:14rem; font-weight:900; background:linear-gradient(135deg,var(--yellow),var(--red)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:countPulse 1s infinite; }
@keyframes countPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* ── QUESTION ── */
#question-screen { background:var(--dark); padding:32px; justify-content:flex-start; }
.q-top { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.q-progress { font-size:1.1rem; font-weight:700; color:var(--text-muted); }
.q-timer-big { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:900; border:4px solid var(--green); transition:all .3s; }
.q-timer-big.warning { border-color:var(--yellow); color:var(--yellow); }
.q-timer-big.danger { border-color:var(--red); color:var(--red); animation:countPulse .5s infinite; }
.q-answer-count { font-size:1.1rem; color:var(--text-muted); }
.q-question-box { width:100%; background:var(--card); border-radius:20px; padding:32px 40px; text-align:center; font-size:1.6rem; font-weight:700; line-height:1.5; margin-bottom:28px; border:1px solid rgba(255,255,255,.05); }
.q-options { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; flex:1; max-height:300px; }
.q-option { border-radius:16px; color:#fff; padding:24px 20px; display:flex; align-items:center; gap:16px; font-size:1.2rem; font-weight:700; line-height:1.4; transition:all .3s; }
.q-option:nth-child(1){background:var(--red)} .q-option:nth-child(2){background:var(--blue)} .q-option:nth-child(3){background:var(--yellow);color:#333} .q-option:nth-child(4){background:var(--green)}
.q-option .shape { font-size:1.6rem; opacity:.7; }

/* ── RESULTS ── */
#results-screen { background:var(--dark); padding:32px; justify-content:flex-start; }
.results-header { font-size:1.8rem; font-weight:800; margin-bottom:20px; text-align:center; }
.results-question { color:var(--text-muted); font-size:1.1rem; margin-bottom:20px; text-align:center; max-width:700px; }
.results-options { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:800px; margin-bottom:24px; }
.results-option { border-radius:16px; color:#fff; padding:20px; display:flex; align-items:center; justify-content:space-between; font-size:1.1rem; font-weight:700; opacity:.35; transition:all .5s; }
.results-option.correct { opacity:1; box-shadow:0 0 0 4px #fff; transform:scale(1.03); }
.results-option:nth-child(1){background:var(--red)} .results-option:nth-child(2){background:var(--blue)} .results-option:nth-child(3){background:var(--yellow);color:#333} .results-option:nth-child(4){background:var(--green)}
.results-option .opt-text { flex:1; } .results-option .opt-count { font-size:1.6rem; font-weight:900; margin-left:12px; } .results-option .opt-check { margin-left:8px; font-size:1.4rem; }
.explanation-box { background:var(--card); border-radius:14px; padding:20px 28px; width:100%; max-width:800px; margin-bottom:24px; border-left:4px solid var(--blue); font-size:1.05rem; line-height:1.5; color:var(--text-muted); }
.explanation-box strong { color:var(--text); }
.results-stats { color:var(--text-muted); font-size:1rem; margin-bottom:24px; }
.leaderboard-mini { width:100%; max-width:500px; }
.lb-title { font-size:1.2rem; font-weight:700; margin-bottom:12px; text-align:center; }
.lb-row { display:flex; align-items:center; padding:14px 20px; background:var(--card); border-radius:12px; margin-bottom:8px; }
.lb-row.gold { background:linear-gradient(135deg,rgba(241,196,15,.15),rgba(241,196,15,.05)); border:1px solid rgba(241,196,15,.3); }
.lb-medal { width:36px; font-size:1.4rem; text-align:center; } .lb-name { flex:1; font-weight:700; font-size:1.1rem; } .lb-score { font-weight:800; font-size:1.2rem; color:var(--yellow); }
.btn-next { padding:16px 48px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font-size:1.2rem; font-weight:700; cursor:pointer; box-shadow:0 6px 20px rgba(52,152,219,.3); transition:transform .15s; margin-top:16px; }
.btn-next:hover { transform:scale(1.04); }

/* ── FINAL ── */
#final-screen { background:linear-gradient(135deg,#1a1a2e,#0f3460); padding:40px; }
.final-trophy { font-size:5rem; margin-bottom:8px; } .final-title { font-size:2.6rem; font-weight:900; margin-bottom:4px; } .final-subtitle { color:var(--text-muted); font-size:1.1rem; margin-bottom:32px; }
.podium { display:flex; align-items:flex-end; gap:16px; margin-bottom:36px; }
.podium-place { text-align:center; border-radius:16px 16px 0 0; padding:20px 28px; min-width:160px; background:var(--card); }
.podium-place.first { background:linear-gradient(180deg,rgba(241,196,15,.2),rgba(241,196,15,.05)); height:200px; order:2; }
.podium-place.second { height:160px; order:1; } .podium-place.third { height:130px; order:3; }
.podium-medal { font-size:2.4rem; margin-bottom:8px; } .podium-name { font-size:1.2rem; font-weight:800; margin-bottom:4px; } .podium-score { color:var(--yellow); font-weight:700; }
.final-full-lb { width:100%; max-width:500px; }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby-screen" class="screen active">
  <div class="lobby-logo">🏠 Quiz <span>Imobiliário</span></div>
  <div class="lobby-sub">Mercado Imobiliário — Treinamento para Corretores</div>
  <div class="conn-status" id="conn-status"><span class="status-dot connecting"></span>Conectando...</div>
  <div class="code-display">
    <div class="code-label">Código do Jogo</div>
    <div class="code-value" id="game-code">------</div>
    <div class="code-url" id="game-url"></div>
  </div>
  <div class="players-section">
    <div class="players-count"><span id="player-count">0</span> jogadores conectados</div>
    <div class="players-list" id="players-list"></div>
  </div>
  <button class="btn-start" id="btn-start" disabled>Iniciar Jogo</button>
</div>

<!-- COUNTDOWN -->
<div id="countdown-screen" class="screen"><div class="big-countdown" id="big-countdown">3</div></div>

<!-- QUESTION -->
<div id="question-screen" class="screen">
  <div class="q-top">
    <div class="q-progress" id="q-progress"></div>
    <div class="q-timer-big" id="q-timer">20</div>
    <div class="q-answer-count" id="q-answer-count">0 respostas</div>
  </div>
  <div class="q-question-box" id="q-question"></div>
  <div class="q-options" id="q-options"></div>
</div>

<!-- RESULTS -->
<div id="results-screen" class="screen">
  <div class="results-header" id="results-header">Resultado</div>
  <div class="results-question" id="results-question"></div>
  <div class="results-options" id="results-options"></div>
  <div class="explanation-box" id="explanation-box"></div>
  <div class="results-stats" id="results-stats"></div>
  <div class="leaderboard-mini" id="leaderboard-mini"><div class="lb-title">🏆 Top 5</div></div>
  <button class="btn-next" id="btn-next">Próxima Pergunta →</button>
</div>

<!-- FINAL -->
<div id="final-screen" class="screen">
  <div class="final-trophy">🏆</div>
  <div class="final-title">Resultado Final</div>
  <div class="final-subtitle">Quiz Imobiliário — Mercado Imobiliário</div>
  <div class="podium" id="podium"></div>
  <div class="final-full-lb" id="final-full-lb"></div>
</div>

<script>
// ═══════════════════════════════════════════
//  PERGUNTAS
// ═══════════════════════════════════════════
const questions = [
  { question:"Qual documento comprova a titularidade de um imóvel?", options:["Contrato de compra e venda","Matrícula do imóvel","IPTU","Escritura pública"], correct:1, explanation:"A matrícula do imóvel no Cartório de Registro de Imóveis é o documento que comprova a titularidade." },
  { question:"O que significa a sigla VGV no mercado imobiliário?", options:["Valor Geral de Vistoria","Valor Geral de Vendas","Volume Geral de Vendas","Valor Garantido de Venda"], correct:1, explanation:"VGV = Valor Geral de Vendas, representa o faturamento potencial total de um empreendimento." },
  { question:"Qual é o prazo máximo de financiamento imobiliário pela Caixa Econômica Federal?", options:["25 anos","30 anos","35 anos","40 anos"], correct:2, explanation:"A Caixa permite financiamento de até 35 anos (420 meses)." },
  { question:"O que é o ITBI?", options:["Imposto sobre Terrenos e Benfeitorias","Imposto de Transmissão de Bens Imóveis","Índice Tributário de Bens Imobiliários","Imposto Territorial Brasileiro Imobiliário"], correct:1, explanation:"O ITBI é o Imposto de Transmissão de Bens Imóveis, cobrado na transferência de propriedade." },
  { question:"Qual índice é mais utilizado para reajuste de aluguéis residenciais?", options:["IPCA","IGP-M","Selic","CDI"], correct:1, explanation:"O IGP-M é tradicionalmente o índice mais usado para reajuste de contratos de aluguel." },
  { question:"O que é a alienação fiduciária de um imóvel?", options:["Doação do imóvel a um fiduciário","Transferência temporária da propriedade ao credor como garantia","Venda judicial do imóvel","Permuta entre proprietários"], correct:1, explanation:"Na alienação fiduciária, o devedor transfere a propriedade ao credor como garantia até quitar o financiamento." },
  { question:"Qual é o percentual máximo do valor do imóvel financiável pelo SFH para imóveis novos?", options:["70%","80%","90%","100%"], correct:1, explanation:"Pelo SFH, é possível financiar até 80% do valor do imóvel." },
  { question:"O que é o habite-se?", options:["Autorização do síndico para morar","Documento de aprovação da planta","Certidão da prefeitura que atesta a conclusão da obra","Registro no cartório de imóveis"], correct:2, explanation:"O habite-se é a certidão emitida pela prefeitura atestando que a obra foi concluída conforme a legislação." },
  { question:"Qual a diferença entre área útil e área total de um apartamento?", options:["Não há diferença","Área útil inclui paredes e área total não","Área total inclui paredes e áreas comuns, área útil é o espaço interno","Área útil é sempre maior que a área total"], correct:2, explanation:"A área útil é o espaço interno utilizável. A área total inclui paredes, áreas comuns e outras dependências." },
  { question:"O que significa Cap Rate no investimento imobiliário?", options:["Capital de Retorno","Taxa de Capitalização","Capacidade de Retorno","Capital Rating"], correct:1, explanation:"Cap Rate (Capitalization Rate) é a taxa de capitalização que mede o retorno anual de um investimento imobiliário." },
  { question:"Qual lei regulamenta as incorporações imobiliárias no Brasil?", options:["Lei 8.245/91","Lei 4.591/64","Lei 10.406/02","Lei 6.015/73"], correct:1, explanation:"A Lei 4.591/64 é a Lei de Incorporações Imobiliárias." },
  { question:"O que é due diligence imobiliária?", options:["Avaliação do valor de mercado","Análise completa da situação jurídica, fiscal e física do imóvel","Inspeção predial","Cálculo de rentabilidade"], correct:1, explanation:"Due diligence é uma análise completa que verifica a situação jurídica, fiscal, ambiental e física do imóvel." },
  { question:"Qual é a comissão padrão de corretagem na venda de imóveis urbanos?", options:["3%","5%","6%","10%"], correct:2, explanation:"A comissão padrão de corretagem para imóveis urbanos é de 6% sobre o valor da venda, conforme tabela do CRECI." },
  { question:"O que é o CRI (Certificado de Recebíveis Imobiliários)?", options:["Certidão de Registro de Imóvel","Título de renda fixa lastreado em créditos imobiliários","Certificado de Regularidade Imobiliária","Contrato de Recebimento Imobiliário"], correct:1, explanation:"O CRI é um título de renda fixa emitido por securitizadoras, lastreado em créditos imobiliários." },
  { question:"O que é zoneamento urbano?", options:["Divisão do condomínio em zonas","Classificação do imóvel por tamanho","Divisão do município em zonas com regras de uso e ocupação","Mapeamento de áreas de risco"], correct:2, explanation:"Zoneamento é a divisão do território municipal em zonas com regras específicas de uso e ocupação do solo." },
  { question:"O que é o direito de preferência na locação?", options:["O locador pode escolher qualquer inquilino","O inquilino tem prioridade na compra do imóvel em caso de venda","O fiador tem preferência sobre o inquilino","O corretor tem prioridade na venda"], correct:1, explanation:"O direito de preferência garante ao inquilino prioridade para comprar o imóvel locado, em igualdade de condições." },
  { question:"O que é a taxa de ocupação de um terreno?", options:["Percentual de moradores por m²","Relação entre área construída no térreo e área total do terreno","Taxa cobrada pela prefeitura","Percentual de áreas verdes"], correct:1, explanation:"Taxa de ocupação é a relação entre a projeção da construção no solo e a área total do terreno." },
  { question:"Qual documento comprova inexistência de débitos condominiais para venda?", options:["Certidão negativa de IPTU","Declaração do síndico ou administradora","Matrícula atualizada","Certidão de ônus reais"], correct:1, explanation:"A declaração do síndico ou administradora atesta que não há débitos condominiais pendentes sobre a unidade." },
  { question:"O que é o coeficiente de aproveitamento de um terreno?", options:["Valor por m² do terreno","Relação entre área máxima construída e área do terreno","Número máximo de pavimentos","Índice de área verde obrigatória"], correct:1, explanation:"O coeficiente de aproveitamento determina quantos m² podem ser construídos em relação à área do terreno." },
  { question:"Qual sistema de amortização é mais utilizado em financiamentos imobiliários no Brasil?", options:["SAC","Tabela Price","SAM","Sistema Americano"], correct:0, explanation:"O SAC (Sistema de Amortização Constante) é o mais usado, com parcelas decrescentes ao longo do tempo." }
];

// ═══════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════
let peer = null;
let gameCode = '';
const players = new Map(); // peerId -> { conn, name, score, streak, answers[] }
let currentQuestion = -1;
let gameState = 'lobby';
let questionStartTime = 0;
let answersReceived = new Map();
let timerInterval = null;
let questionTimer = null;
const TIMER_DURATION = 20;
const shapes = ['▲','◆','●','■'];
const medals = ['🥇','🥈','🥉'];

// ═══════════════════════════════════════════
//  PEER SETUP
// ═══════════════════════════════════════════
function initPeer() {
  gameCode = String(Math.floor(100000 + Math.random() * 900000));
  const peerId = 'quizimob-' + gameCode;

  peer = new Peer(peerId, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]}
  });

  peer.on('open', () => {
    document.getElementById('game-code').textContent = gameCode;
    const base = location.href.replace(/\/[^\/]*$/, '/');
    document.getElementById('game-url').textContent = 'Acesse: ' + base + 'index.html';
    document.getElementById('conn-status').innerHTML = '<span class="status-dot ready"></span>Pronto para receber jogadores';
  });

  peer.on('connection', (conn) => {
    conn.on('open', () => {
      conn.on('data', (msg) => handlePlayerMessage(conn, msg));
    });
    conn.on('close', () => removePlayer(conn.peer));
    conn.on('error', () => removePlayer(conn.peer));
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    if (err.type === 'unavailable-id') {
      document.getElementById('conn-status').innerHTML = '<span class="status-dot error"></span>Código em uso. Recarregue a página.';
    } else {
      document.getElementById('conn-status').innerHTML = '<span class="status-dot error"></span>Erro de conexão. Recarregue a página.';
    }
  });
}

// ═══════════════════════════════════════════
//  MESSAGE HANDLING
// ═══════════════════════════════════════════
function handlePlayerMessage(conn, msg) {
  switch (msg.type) {
    case 'join':
      if (gameState !== 'lobby') { conn.send({ type:'error', message:'O jogo já começou.' }); return; }
      for (const [, p] of players) {
        if (p.name.toLowerCase() === msg.name.toLowerCase()) {
          conn.send({ type:'error', message:'Já existe um jogador com esse nome.' }); return;
        }
      }
      players.set(conn.peer, { conn, name: msg.name, score: 0, streak: 0, answers: [] });
      conn.send({ type:'joined', name: msg.name });
      updatePlayerList();
      break;

    case 'answer':
      if (gameState !== 'question') return;
      if (answersReceived.has(conn.peer)) return;
      const elapsed = (Date.now() - questionStartTime) / 1000;
      if (elapsed > TIMER_DURATION + 1) return;
      const q = questions[currentQuestion];
      const isCorrect = msg.answer === q.correct;
      const timeBonus = Math.max(0, Math.round((1 - elapsed / TIMER_DURATION) * 500));
      const points = isCorrect ? 500 + timeBonus : 0;
      const player = players.get(conn.peer);
      if (!player) return;
      if (isCorrect) { player.streak++; const sb = player.streak >= 3 ? 100 * Math.min(player.streak-2,5) : 0; player.score += points + sb; }
      else { player.streak = 0; }
      player.answers.push({ qi: currentQuestion, answer: msg.answer, isCorrect, points });
      answersReceived.set(conn.peer, { answer: msg.answer, isCorrect, points, elapsed });
      conn.send({ type:'answer-result', isCorrect, points, streak: player.streak, totalScore: player.score });
      document.getElementById('q-answer-count').textContent = `${answersReceived.size}/${players.size} respostas`;
      if (answersReceived.size >= players.size) { clearTimeout(questionTimer); showResults(); }
      break;
  }
}

function broadcast(msg) {
  for (const [, p] of players) {
    try { p.conn.send(msg); } catch(e) {}
  }
}

function removePlayer(peerId) {
  players.delete(peerId);
  updatePlayerList();
}

function updatePlayerList() {
  document.getElementById('player-count').textContent = players.size;
  const list = document.getElementById('players-list');
  list.innerHTML = '';
  for (const [, p] of players) {
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.textContent = p.name;
    list.appendChild(chip);
  }
  document.getElementById('btn-start').disabled = players.size < 1;
}

// ═══════════════════════════════════════════
//  GAME FLOW
// ═══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('btn-start').addEventListener('click', () => {
  gameState = 'starting';
  broadcast({ type:'game-starting' });
  showScreen('countdown-screen');
  let count = 3;
  document.getElementById('big-countdown').textContent = count;
  const ci = setInterval(() => { count--; if(count<=0){clearInterval(ci);nextQuestion();return;} document.getElementById('big-countdown').textContent=count; }, 1000);
});

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) { finishGame(); return; }
  gameState = 'question';
  answersReceived = new Map();
  questionStartTime = Date.now();
  const q = questions[currentQuestion];
  const data = { type:'new-question', index:currentQuestion, total:questions.length, question:q.question, options:q.options, duration:TIMER_DURATION };
  broadcast(data);
  showScreen('question-screen');
  document.getElementById('q-progress').textContent = `Pergunta ${currentQuestion+1} de ${questions.length}`;
  document.getElementById('q-question').textContent = q.question;
  document.getElementById('q-answer-count').textContent = '0 respostas';
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt,i) => { const d=document.createElement('div'); d.className='q-option'; d.innerHTML=`<span class="shape">${shapes[i]}</span> ${opt}`; opts.appendChild(d); });
  let timeLeft = TIMER_DURATION;
  const timerEl = document.getElementById('q-timer');
  timerEl.textContent = timeLeft; timerEl.className = 'q-timer-big';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => { timeLeft--; timerEl.textContent=Math.max(0,timeLeft); if(timeLeft<=5)timerEl.className='q-timer-big danger'; else if(timeLeft<=10)timerEl.className='q-timer-big warning'; if(timeLeft<=0)clearInterval(timerInterval); }, 1000);
  questionTimer = setTimeout(() => showResults(), TIMER_DURATION * 1000 + 1000);
}

function showResults() {
  if (gameState === 'results') return;
  gameState = 'results';
  clearInterval(timerInterval);
  const q = questions[currentQuestion];
  const answerCounts = [0,0,0,0];
  let correctCount = 0;
  for (const [,ans] of answersReceived) { answerCounts[ans.answer]++; if(ans.isCorrect)correctCount++; }
  const leaderboard = getLeaderboard();
  const isLast = currentQuestion >= questions.length - 1;
  broadcast({ type:'question-results', correct:q.correct, explanation:q.explanation, answerCounts, correctCount, totalPlayers:players.size, leaderboard, isLast });
  showScreen('results-screen');
  const pct = players.size > 0 ? Math.round((correctCount/players.size)*100) : 0;
  document.getElementById('results-header').textContent = `${pct}% acertaram!`;
  document.getElementById('results-question').textContent = q.question;
  const optsEl = document.getElementById('results-options');
  optsEl.innerHTML = '';
  q.options.forEach((opt,i) => { const d=document.createElement('div'); d.className='results-option'+(i===q.correct?' correct':''); d.innerHTML=`<span class="opt-text">${shapes[i]} ${opt}</span><span class="opt-count">${answerCounts[i]}</span>${i===q.correct?'<span class="opt-check">✓</span>':''}`; optsEl.appendChild(d); });
  document.getElementById('explanation-box').innerHTML = `<strong>💡 Explicação:</strong> ${q.explanation}`;
  document.getElementById('results-stats').textContent = `${correctCount} de ${players.size} jogadores acertaram`;
  renderLeaderboard(leaderboard);
  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = isLast ? '🏆 Ver Resultado Final' : 'Próxima Pergunta →';
  btnNext.onclick = () => { if(isLast){broadcast({type:'next-question'}); finishGame();} else nextQuestion(); };
}

function getLeaderboard() {
  return [...players.values()].sort((a,b)=>b.score-a.score).slice(0,5).map((p,i)=>({rank:i+1,name:p.name,score:p.score}));
}

function renderLeaderboard(lb) {
  const el = document.getElementById('leaderboard-mini');
  el.innerHTML = '<div class="lb-title">🏆 Top 5</div>';
  lb.forEach((p,i) => { const r=document.createElement('div'); r.className='lb-row'+(i===0?' gold':''); r.innerHTML=`<span class="lb-medal">${i<3?medals[i]:(i+1)+'º'}</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.score}</span>`; el.appendChild(r); });
}

function finishGame() {
  gameState = 'finished';
  const lb = [...players.values()].sort((a,b)=>b.score-a.score).map((p,i)=>({rank:i+1,name:p.name,score:p.score}));
  broadcast({ type:'game-over', leaderboard:lb });
  showScreen('final-screen');
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  const pc = ['first','second','third'];
  lb.slice(0,3).forEach((p,i) => { const d=document.createElement('div'); d.className=`podium-place ${pc[i]}`; d.innerHTML=`<div class="podium-medal">${medals[i]}</div><div class="podium-name">${p.name}</div><div class="podium-score">${p.score} pts</div>`; podium.appendChild(d); });
  const flb = document.getElementById('final-full-lb');
  flb.innerHTML = '';
  lb.forEach((p,i) => { const r=document.createElement('div'); r.className='lb-row'+(i===0?' gold':''); r.innerHTML=`<span class="lb-medal">${i<3?medals[i]:(i+1)+'º'}</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.score} pts</span>`; flb.appendChild(r); });
}

initPeer();
</script>
</body>
</html>
